<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Premium — Repos</title>
<style>
@font-face{font-family:'Sora';font-style:normal;font-weight:100 800;font-display:block;
  src:url(fonts/sora-latin-wght-normal.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Sora';font-style:normal;font-weight:100 800;font-display:block;
  src:url(fonts/sora-latin-ext-wght-normal.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

html,body{margin:0;background:#000}
#root{width:1280px;height:720px;overflow:hidden}
</style>
<style>
body{margin:0;background:#000}
a{color:#D1D1D6}a:hover{color:#F5F5F7}
@keyframes cocoIn{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cocoDriftS{0%{transform:translate(0,0)}33%{transform:translate(6px,-4px)}66%{transform:translate(-5px,5px)}100%{transform:translate(4px,6px)}}
@keyframes cocoGlow{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
@keyframes cocoRingIn{from{stroke-dashoffset:69.12}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="--accent: {{accent}}; width: 1280px; height: 720px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; left: 50%; top: 470px; width: 1100px; height: 520px; border-radius: 50%; background: radial-gradient(ellipse, var(--accent) 0%, transparent 65%); filter: blur(120px); opacity: {{glow}}; animation: cocoGlow 14s ease-in-out infinite"></div>
<svg aria-hidden="true" width="1280" height="720" style="position: absolute; left: 0; top: 0; opacity: 0.07; mix-blend-mode: overlay"><filter id="grainR"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1280" height="720" filter="url(#grainR)"></rect></svg>
<div style="position: absolute; inset: 0; animation: {{drift}}">
<div style="position: absolute; left: 0; right: 0; top: 120px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 20px; font-weight: 600; color: rgba(245,245,247,0.6); animation: cocoIn 1s cubic-bezier(.32,.72,0,1) .1s both">{{date}}</span>
<span style="font-size: 176px; font-weight: 600; letter-spacing: -0.055em; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #FFFFFF 0%, #A9A9AE 100%); -webkit-background-clip: text; background-clip: text; color: transparent; animation: cocoIn 1.2s cubic-bezier(.32,.72,0,1) .2s both">{{time}}</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: 452px; display: flex; justify-content: center; animation: cocoIn 1.1s cubic-bezier(.32,.72,0,1) .45s both">
<div style="display: flex; align-items: center; height: 76px; padding: 0 8px; border-radius: 38px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(40px) saturate(1.6); -webkit-backdrop-filter: blur(40px) saturate(1.6)">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 22px">
<svg width="20" height="18" viewBox="0 0 18 16" aria-hidden="true" style="color: rgba(245,245,247,0.7)"><rect x="1" y="1" width="16" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M6.5 15h5M9 11.5V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
<div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">PC-Salon</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">En ligne</span></div>
</div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 22px">
<svg width="20" height="15" viewBox="0 0 18 13" aria-hidden="true" style="color: rgba(245,245,247,0.7)"><circle cx="9" cy="11" r="1.6" fill="currentColor"></circle><path d="M5.3 7.6a5.2 5.2 0 0 1 7.4 0" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"></path><path d="M2.2 4.6a9.6 9.6 0 0 1 13.6 0" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"></path></svg>
<div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{lat}} ms</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">Wi-Fi excellent</span></div>
</div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 22px">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true" style="transform: rotate(-90deg)"><circle cx="13" cy="13" r="11" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"></circle><circle cx="13" cy="13" r="11" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="69.12" stroke-dashoffset="12.44" style="stroke: var(--accent); animation: cocoRingIn 1.6s cubic-bezier(.32,.72,0,1) .6s both"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">82 %</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">Environ 3 h</span></div>
</div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 22px 0 18px">
<div aria-hidden="true" style="width: 32px; height: 45px; border-radius: 5px; background: {{art}}; filter: brightness(0.75); box-shadow: 0 0 0 1px rgba(255,255,255,0.1)"></div>
<div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">Minecraft</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">Il y a 2 h</span></div>
</div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.5); animation: cocoIn 1s cubic-bezier(.32,.72,0,1) 1s both">
<span>Appuyez sur</span>
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.45); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #F5F5F7">A</span>
<span>pour ouvrir l'accueil</span>
</div>
</div>
</div>
</template>
<script>
(function(){
  const P = new URLSearchParams(location.search);
  if (P.get('now')) {
    const fixed = Date.parse(P.get('now'));
    Date.now = () => fixed;
  }
  window.DCLogic = class { constructor(props){ this.props = props; this.state = null; }
    setState(s){ this.state = Object.assign({}, this.state, s); } forceUpdate(){} };
})();
</script>
<script>
const PROPS = {"accent": {"editor": "color", "default": "#F2802A", "options": ["#F2802A", "#F5F5F7", "#6E9BFF"]}, "glow": {"editor": "range", "default": 0.22, "min": 0, "max": 0.6, "step": 0.02}, "drift": {"editor": "boolean", "default": true}, "$preview": {"width": 1280, "height": 720}};
class Component extends DCLogic {
  componentDidMount() {
    this._timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this._timer);
  }
  renderVals() {
    const now = (this.state && this.state.now) || Date.now();
    const d = new Date(now);
    const pad = (n) => String(n).padStart(2, '0');
    const lats = [4, 4, 5, 3, 4, 6, 4, 5];
    const raw = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    return {
      accent: this.props.accent ?? '#F2802A',
      glow: this.props.glow ?? 0.22,
      drift: (this.props.drift ?? true) ? 'cocoDriftS 90s ease-in-out infinite alternate' : 'none',
      art: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      date: raw.charAt(0).toUpperCase() + raw.slice(1),
      lat: lats[Math.floor(now / 2000) % 8]
    };
  }
}
</script>
<script>
(function(){
  const P = new URLSearchParams(location.search);
  const props = {};
  for (const [k, spec] of Object.entries(PROPS)) {
    if (k.startsWith('$')) continue;
    let v = spec.default;
    if (P.has(k)) {
      const raw = P.get(k);
      v = typeof v === 'number' ? Number(raw) : typeof v === 'boolean' ? raw === 'true' : raw;
    }
    props[k] = v;
  }
  const comp = new Component(props);
  const vals = comp.renderVals();
  const get = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), vals);
  const tpl = document.getElementById('tpl').innerHTML;
  document.getElementById('root').innerHTML =
    tpl.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => { const v = get(p); return v == null ? '' : String(v); });
  const at = P.get('at');
  document.fonts.ready.then(() => {
    if (at !== null) {
      document.getAnimations().forEach(a => { a.pause(); a.currentTime = Number(at) * 1000; });
    }
    window.__ready = true;
  });
})();
</script>
</body>
</html>
