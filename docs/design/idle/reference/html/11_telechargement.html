<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Premium — Téléchargement</title>
<style>
@font-face{font-family:'Sora';font-style:normal;font-weight:100 800;font-display:block;
  src:url(fonts/sora-latin-wght-normal.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Sora';font-style:normal;font-weight:100 800;font-display:block;
  src:url(fonts/sora-latin-ext-wght-normal.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

html,body{margin:0;background:#000}
#root{width:1280px;height:720px;overflow:hidden}
</style>
<style>
body{margin:0;background:#000}
a{color:#D1D1D6}a:hover{color:#F5F5F7}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoIn{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cocoTilt{0%{transform:perspective(1400px) rotateY(9deg) rotateX(1deg)}100%{transform:perspective(1400px) rotateY(3deg) rotateX(-1deg)}}
@keyframes cocoSheen{0%,55%{transform:translateX(-160%) skewX(-18deg)}85%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes cocoDriftS{0%{transform:translate(0,0)}33%{transform:translate(6px,-4px)}66%{transform:translate(-5px,5px)}100%{transform:translate(4px,6px)}}
@keyframes cocoArrow{0%,100%{transform:translateY(-1px)}50%{transform:translateY(2px)}}
@keyframes cocoBar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="--accent: {{accent}}; width: 1280px; height: 720px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 28% 45%, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.82) 72%)"></div>
<svg aria-hidden="true" width="1280" height="720" style="position: absolute; left: 0; top: 0; opacity: 0.07; mix-blend-mode: overlay"><filter id="grainT"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1280" height="720" filter="url(#grainT)"></rect></svg>
<div style="position: absolute; inset: 0; animation: {{drift}}">
<div style="position: absolute; top: 36px; right: 56px; display: flex; align-items: center; gap: 12px; animation: cocoIn 1s cubic-bezier(.32,.72,0,1) .6s both">
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span>
<svg width="25" height="12" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#F5F5F7" stroke-opacity="0.45"></rect><rect x="2" y="2" width="16.4" height="9" rx="2" fill="#F5F5F7"></rect><rect x="24.8" y="4.5" width="1.6" height="4" rx="0.8" fill="#F5F5F7" fill-opacity="0.45"></rect></svg>
</div>
<div style="position: absolute; left: 112px; top: 104px; width: 326px; height: 460px; animation: cocoIn 1.2s cubic-bezier(.32,.72,0,1) 0s both">
<div style="position: absolute; left: 0; top: 0; width: 326px; height: 460px; transform-style: preserve-3d; animation: cocoTilt 18s ease-in-out infinite alternate">
<div style="position: absolute; left: 0; top: 0; width: 326px; height: 460px; border-radius: 12px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.07)">
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{art}}; filter: brightness(0.62)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 42%)"></div>
<div aria-hidden="true" style="position: absolute; top: -20%; bottom: -20%; left: 0; width: 30%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.13), rgba(255,255,255,0)); animation: cocoSheen 11s ease-in-out infinite"></div>
<span style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: rgba(245,245,247,0.45)">Jaquette Minecraft · 600 × 848</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 466px; width: 326px; height: 460px; border-radius: 12px; overflow: hidden; transform: scaleY(-1); -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0) 28%); mask-image: linear-gradient(to top, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0) 28%)">
<div style="position: absolute; inset: 0; background: {{art}}; filter: brightness(0.62)"></div>
</div>
</div>
</div>
<div style="position: absolute; left: 520px; top: 170px; width: 660px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; animation: cocoIn 1s cubic-bezier(.32,.72,0,1) .15s both">
<svg width="12" height="12" viewBox="0 0 20 20" aria-hidden="true"><g style="animation: cocoArrow 1.8s ease-in-out infinite"><path d="M10 2.5v10M5.5 8.5 10 13l4.5-4.5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--accent)"></path></g><path d="M3 17.5h14" stroke-width="2.4" stroke-linecap="round" style="stroke: var(--accent)"></path></svg>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: rgba(245,245,247,0.55)">TÉLÉCHARGEMENT SUR PC-SALON</span>
</div>
<span style="margin-top: 14px; font-size: 68px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.05; animation: cocoIn 1s cubic-bezier(.32,.72,0,1) .22s both">Minecraft</span>
<span style="margin-top: 8px; font-size: 17px; font-weight: 500; color: rgba(245,245,247,0.55); animation: cocoIn 1s cubic-bezier(.32,.72,0,1) .29s both">Mojang Studios · Bac à sable</span>
<div style="margin-top: 56px; display: flex; flex-direction: column; gap: 8px; animation: cocoIn 1s cubic-bezier(.32,.72,0,1) .4s both">
<div style="display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums">
<span style="font-size: 72px; font-weight: 600; letter-spacing: -0.045em; line-height: 1">{{dl}}</span>
<span style="font-size: 28px; font-weight: 500; color: rgba(245,245,247,0.5)">%</span>
</div>
<span style="font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.55); font-variant-numeric: tabular-nums">Mise à jour · {{eta}}</span>
<div style="margin-top: 14px; width: 420px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12); position: relative; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{dl}}%; background: var(--accent); transition: width 1s linear; overflow: hidden">
<div style="position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.7), rgba(255,255,255,0)); animation: cocoBar 2.4s ease-in-out infinite"></div>
</div>
</div>
</div>
<div style="margin-top: 44px; display: flex; align-items: center; gap: 28px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.78); animation: cocoIn 1s cubic-bezier(.32,.72,0,1) .5s both">
<span style="display: flex; align-items: center; gap: 8px"><svg width="17" height="15" viewBox="0 0 18 16" aria-hidden="true"><rect x="1" y="1" width="16" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M6.5 15h5M9 11.5V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>PC-Salon · En ligne</span>
<span style="display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums"><svg width="15" height="13" viewBox="0 0 16 14" aria-hidden="true"><rect x="1" y="9" width="3" height="4" rx="1" fill="currentColor"></rect><rect x="6.5" y="5.5" width="3" height="7.5" rx="1" fill="currentColor"></rect><rect x="12" y="1" width="3" height="12" rx="1" fill="currentColor"></rect></svg>{{lat}} ms</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="17" height="12" viewBox="0 0 18 13" aria-hidden="true"><circle cx="9" cy="11" r="1.6" fill="currentColor"></circle><path d="M5.3 7.6a5.2 5.2 0 0 1 7.4 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"></path><path d="M2.2 4.6a9.6 9.6 0 0 1 13.6 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>Excellent</span>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.5); animation: cocoIn 1s cubic-bezier(.32,.72,0,1) 1s both">
<span>Appuyez sur</span>
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.45); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #F5F5F7">A</span>
<span>pour ouvrir l'accueil</span>
</div>
</div>
</div>
</template>
<script>
(function(){
  const P = new URLSearchParams(location.search);
  if (P.get('now')) {
    const fixed = Date.parse(P.get('now'));
    Date.now = () => fixed;
  }
  window.DCLogic = class { constructor(props){ this.props = props; this.state = null; }
    setState(s){ this.state = Object.assign({}, this.state, s); } forceUpdate(){} };
})();
</script>
<script>
const PROPS = {"accent": {"editor": "color", "default": "#F2802A", "options": ["#F2802A", "#F5F5F7", "#6E9BFF"]}, "drift": {"editor": "boolean", "default": true}, "$preview": {"width": 1280, "height": 720}};
class Component extends DCLogic {
  componentDidMount() {
    this._timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this._timer);
  }
  renderVals() {
    const now = (this.state && this.state.now) || Date.now();
    if (this._t0 == null) this._t0 = now;
    const d = new Date(now);
    const pad = (n) => String(n).padStart(2, '0');
    const secs = Math.floor((now - this._t0) / 1000);
    const lats = [4, 4, 5, 3, 4, 6, 4, 5];
    const speeds = ['1,2 Go/s', '1,1 Go/s', '1,3 Go/s', '1,2 Go/s'];
    const dl = Math.min(99, 42 + Math.floor(secs * 0.15));
    const remain = Math.max(1, Math.ceil((100 - dl) / 10));
    return {
      accent: this.props.accent ?? '#F2802A',
      art: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      drift: (this.props.drift ?? true) ? 'cocoDriftS 90s ease-in-out infinite alternate' : 'none',
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      lat: lats[Math.floor(now / 2000) % 8],
      dl: dl,
      eta: speeds[Math.floor(now / 3000) % 4] + ' · environ ' + remain + ' min'
    };
  }
}
</script>
<script>
(function(){
  const P = new URLSearchParams(location.search);
  const props = {};
  for (const [k, spec] of Object.entries(PROPS)) {
    if (k.startsWith('$')) continue;
    let v = spec.default;
    if (P.has(k)) {
      const raw = P.get(k);
      v = typeof v === 'number' ? Number(raw) : typeof v === 'boolean' ? raw === 'true' : raw;
    }
    props[k] = v;
  }
  const comp = new Component(props);
  const vals = comp.renderVals();
  const get = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), vals);
  const tpl = document.getElementById('tpl').innerHTML;
  document.getElementById('root').innerHTML =
    tpl.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => { const v = get(p); return v == null ? '' : String(v); });
  const at = P.get('at');
  document.fonts.ready.then(() => {
    if (at !== null) {
      document.getAnimations().forEach(a => { a.pause(); a.currentTime = Number(at) * 1000; });
    }
    window.__ready = true;
  });
})();
</script>
</body>
</html>
