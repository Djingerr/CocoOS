<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Hôte injoignable</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoSpin{to{transform:rotate(360deg)}}
@keyframes cocoKen{0%{transform:scale(1.02) translate(0,0)}100%{transform:scale(1.1) translate(-20px,8px)}}
@keyframes cocoShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(9px)}45%{transform:translateX(-7px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(1px)}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: 0">
<div style="position: absolute; inset: 0; background: {{art}}; animation: cocoKen 14s ease-in-out infinite alternate">
<div style="position: absolute; left: -5%; right: -5%; bottom: 0; height: 58%; background: rgba(0,0,0,0.3); clip-path: polygon(0 55%, 14% 22%, 28% 48%, 44% 6%, 60% 44%, 76% 18%, 100% 50%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: -5%; right: -5%; bottom: 0; height: 36%; background: rgba(0,0,0,0.45); clip-path: polygon(0 45%, 20% 20%, 38% 52%, 56% 26%, 74% 58%, 90% 30%, 100% 44%, 100% 100%, 0 100%)"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,{{dim}}); transition: background 600ms ease"></div>
</div>

<div style="position: absolute; left: 340px; top: 250px; width: 600px; display: flex; flex-direction: column; align-items: center">
<div style="position: relative; width: 49.3px; height: 49.3px; animation: {{shake}}">
<div style="position: absolute; inset: 0; box-sizing: border-box; border: 8.8px solid {{ringColor}}; border-radius: 50%; transition: border-color 400ms ease"></div>
<svg aria-hidden="true" width="49.3" height="49.3" viewBox="0 0 49.3 49.3" style="position: absolute; inset: 0; opacity: {{spinOp}}; transition: opacity 250ms ease; animation: cocoSpin 1.1s linear infinite"><circle cx="24.65" cy="24.65" r="20.25" fill="none" stroke-width="8.8" stroke-linecap="round" stroke-dasharray="34 93.23" style="stroke: var(--accent)"></circle></svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; opacity: {{failOp}}; transform: scale({{bangScale}}); transition: opacity 300ms ease 150ms, transform 500ms cubic-bezier(.3,1.5,.4,1) 150ms">!</span>
</div>

<div style="position: relative; width: 600px; height: 34px; margin-top: 26px">
<span style="position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; opacity: {{connOp}}; transform: translateY({{connTy}}px); transition: opacity 300ms ease, transform 450ms cubic-bezier(.32,.72,0,1)">Minecraft</span>
<span style="position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: -0.025em; opacity: {{failOp}}; transform: translateY({{failTy}}px); transition: opacity 300ms ease 80ms, transform 450ms cubic-bezier(.32,.72,0,1) 80ms">PC-Salon ne répond pas</span>
</div>
<div style="position: relative; width: 600px; height: 44px; margin-top: 6px">
<span style="position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.62); opacity: {{connOp}}; transition: opacity 300ms ease">{{connText}}</span>
<span style="position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 15px; font-weight: 400; line-height: 1.5; color: rgba(245,245,247,0.7); opacity: {{failOp}}; transform: translateY({{failTy}}px); transition: opacity 300ms ease 140ms, transform 450ms cubic-bezier(.32,.72,0,1) 140ms">Vérifiez que le PC est allumé et relié au même réseau,<br>ou réveillez-le à distance.</span>
</div>

<div style="margin-top: 34px; display: flex; gap: 12px; opacity: {{failOp}}; transform: translateY({{btnTy}}px); transition: opacity 300ms ease 200ms, transform 500ms cubic-bezier(.32,.72,0,1) 200ms">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 16px; font-weight: 600; transform: scale({{press}}); transition: {{pressTr}}"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Réessayer</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Réveiller le PC</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">B</span>Annuler</button>
</div>
</div>

<div style="position: absolute; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #F5F5F7; color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">A</span>Réessayer
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 8000 }), 100);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const accent = this.props.accent ?? '#F2802A';
    const fail = t >= 2600 && t < 6900;
    const press = t >= 6500 && t < 6700;
    return {
      accent: accent,
      art: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      dim: fail ? 0.78 : 0.58,
      ringColor: fail ? 'rgba(245,245,247,0.22)' : 'color-mix(in oklab, ' + accent + ' 30%, transparent)',
      spinOp: fail ? 0 : 1,
      shake: fail ? 'cocoShake 520ms cubic-bezier(.36,.07,.19,.97) 1' : 'none',
      failOp: fail ? 1 : 0,
      bangScale: fail ? 1 : 0.4,
      failTy: fail ? 0 : 10,
      btnTy: fail ? 0 : 16,
      connOp: fail ? 0 : 1,
      connTy: fail ? -10 : 0,
      connText: t < 1300 || t >= 6900 ? 'Connexion à PC-Salon…' : 'Nouvelle tentative…',
      press: press ? 0.94 : 1,
      pressTr: press ? 'transform 110ms ease-out' : 'transform 480ms cubic-bezier(.3,1.6,.4,1)',
      keyOp: t >= 6300 && t < 7100 ? 1 : 0,
      keyTy: t >= 6300 && t < 7100 ? 0 : 8
    };
  }
}
</script>
</body>
</html>
