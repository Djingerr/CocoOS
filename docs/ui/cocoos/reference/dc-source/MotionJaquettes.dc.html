<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Chargement des jaquettes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoShimmer{0%{transform:translateX(-120%) skewX(-12deg)}100%{transform:translateX(260%) skewX(-12deg)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{bg.op}}; transition: {{bg.tr}}">
<div style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.85) 75%)"></div>
</div>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 560px">
<sc-for list="{{covers}}" as="c" hint-placeholder-count="7">
<div style="position: absolute; left: {{c.left}}px; top: {{c.top}}px; width: {{c.w}}px; height: {{c.h}}px; z-index: {{c.z}}; transform: {{c.transform}}; filter: {{c.filter}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06)">
<div style="position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.09), rgba(255,255,255,0)); animation: cocoShimmer 1.5s ease-in-out infinite; animation-delay: {{c.shimmerDelay}}"></div>
<div style="position: absolute; inset: 0; background: {{c.art}}; opacity: {{c.op}}; transform: scale({{c.sc}}); filter: blur({{c.blur}}px); transition: {{c.tr}}">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0) 45%)"></div>
<span style="position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600">{{c.title}}</span>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; opacity: {{c.op}}; transition: {{c.tr}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; top: 516px; height: 80px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 6px; display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: {{skel.op}}; transition: {{skel.tr}}">
<div style="position: relative; width: 280px; height: 40px; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.08)"><div style="position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.1), rgba(255,255,255,0)); animation: cocoShimmer 1.5s ease-in-out infinite"></div></div>
<div style="position: relative; width: 220px; height: 14px; border-radius: 7px; overflow: hidden; background: rgba(255,255,255,0.06)"><div style="position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.1), rgba(255,255,255,0)); animation: cocoShimmer 1.5s ease-in-out infinite"></div></div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; opacity: {{ttl.op}}; transform: translateY({{ttl.ty}}px); filter: blur({{ttl.blur}}px); transition: {{ttl.tr}}">
<span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05">Minecraft</span>
<span style="margin-top: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">Mojang Studios · 2011 · Bac à sable</span>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 620px; display: flex; justify-content: center; gap: 12px">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>
<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; top: 30px; right: 56px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500">4 ms</span></div>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span>
</div>
<div aria-hidden="true" style="position: absolute; z-index: 50; inset: 0; background: #000; opacity: {{curtain}}; transition: opacity 400ms ease-in-out"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 7000 }), 50);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const E = 'cubic-bezier(.32,.72,0,1)';
    const instant = t >= 6500;
    const ART = {
      mc: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      ce: 'radial-gradient(circle at 40% 30%, #F49AC1 0%, transparent 42%), radial-gradient(circle at 65% 75%, #6C4BD1 0%, transparent 52%), linear-gradient(160deg, #2B1B4F 0%, #0C0818 100%)',
      sv: 'radial-gradient(circle at 30% 30%, #F6D55C 0%, transparent 40%), radial-gradient(circle at 65% 70%, #6DBE45 0%, transparent 52%), linear-gradient(160deg, #2F6B3A 0%, #0E1E10 100%)',
      er: 'radial-gradient(circle at 50% 30%, #E8C46A 0%, transparent 38%), radial-gradient(circle at 40% 80%, #5C4520 0%, transparent 52%), linear-gradient(160deg, #2A2214 0%, #0A0805 100%)',
      ha: 'radial-gradient(circle at 45% 30%, #FF6B4A 0%, transparent 40%), radial-gradient(circle at 60% 78%, #8A1C1C 0%, transparent 52%), linear-gradient(160deg, #2A0B0B 0%, #090303 100%)'
    };
    const order = [['Hades', 'ha', 2600], ['Celeste', 'ce', 2150], ['Hollow Knight', 'hk', 1600], ['Minecraft', 'mc', 1200], ['Forza Horizon 5', 'fh', 1750], ['Stardew Valley', 'sv', 2000], ['Elden Ring', 'er', 2400]];
    const S = [[240, 340, 0, 1], [190, 269, 250, 0.6], [160, 227, 430, 0.38], [140, 198, 580, 0.2]];
    const covers = order.map((x, i) => {
      const o = i - 3;
      const k = Math.abs(o);
      const z = S[k];
      const sg = Math.sign(o);
      const cx = 640 + sg * z[2];
      const loaded = t >= x[2] && !instant;
      return {
        title: x[0], art: ART[x[1]], w: z[0], h: z[1], left: Math.round(cx - z[0] / 2), top: 436 - z[1], z: 10 - k,
        transform: 'perspective(900px) rotateY(' + (o === 0 ? 0 : -sg * (38 + (k - 1) * 6)) + 'deg)',
        filter: 'brightness(' + z[3] + ')',
        shimmerDelay: (i * 0.12).toFixed(2) + 's',
        op: loaded ? 1 : 0,
        sc: loaded ? 1 : 1.04,
        blur: loaded ? 0 : 8,
        tr: instant ? 'none' : 'opacity 500ms ease, transform 700ms ' + E + ', filter 500ms ease'
      };
    });
    const titled = t >= 1350 && !instant;
    return {
      accent: this.props.accent ?? '#F2802A',
      art: ART.mc,
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      covers: covers,
      bg: { op: t >= 1300 && !instant ? 1 : 0, tr: instant ? 'none' : 'opacity 900ms ease' },
      skel: { op: titled ? 0 : 1, tr: instant ? 'none' : 'opacity 300ms ease' },
      ttl: { op: titled ? 1 : 0, ty: titled ? 0 : 10, blur: titled ? 0 : 6, tr: instant ? 'none' : 'opacity 420ms ease 120ms, transform 600ms ' + E + ' 120ms, filter 420ms ease 120ms' },
      curtain: t >= 6200 ? 1 : 0
    };
  }
}
</script>
</body>
</html>
