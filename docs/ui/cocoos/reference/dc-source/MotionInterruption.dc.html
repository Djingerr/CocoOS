<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Animations interrompues</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<sc-for list="{{halves}}" as="h" hint-placeholder-count="2">
<div style="position: absolute; left: {{h.x}}px; top: 0; width: 640px; height: 800px; overflow: hidden; border-right: 1px solid rgba(255,255,255,0.08)">
<div aria-hidden="true" style="position: absolute; inset: -60px; background: radial-gradient(circle at 40% 35%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 60% 80%, #6B4A2F 0%, transparent 50%), linear-gradient(160deg, #1E2A1C 0%, #0A0806 100%); filter: blur(60px); opacity: 0.8"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.35)"></div>
<span style="position: absolute; left: 40px; top: 40px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: {{h.tagColor}}">{{h.tag}}</span>
<span style="position: absolute; left: 40px; top: 64px; font-size: 26px; font-weight: 600; letter-spacing: -0.025em">{{h.title}}</span>
<div style="position: absolute; left: 80px; top: 200px; width: 150px; height: 212px; border-radius: 12px; background: linear-gradient(160deg, #3E5E36, #14110D); box-shadow: 0 30px 60px rgba(0,0,0,0.5); filter: brightness({{h.dim}}); transition: filter 400ms ease"></div>
<span style="position: absolute; left: 80px; top: 434px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; filter: brightness({{h.dim}})">Minecraft</span>
<aside style="position: absolute; left: 330px; top: 130px; width: 290px; height: 480px; box-sizing: border-box; padding: 24px; border-radius: 28px; background: rgba(30,30,32,0.86); border: 1px solid rgba(255,255,255,0.1); box-shadow: -20px 0 60px rgba(0,0,0,0.5); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); transform: translateX({{h.tx}}px); opacity: {{h.op}}; transition: {{h.tr}}">
<span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Options</span>
<div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
<span style="height: 42px; border-radius: 12px; background: rgba(255,255,255,0.12)"></span>
<span style="height: 42px; border-radius: 12px; background: rgba(255,255,255,0.06)"></span>
<span style="height: 42px; border-radius: 12px; background: rgba(255,255,255,0.06)"></span>
<span style="height: 42px; border-radius: 12px; background: rgba(255,255,255,0.06)"></span>
</div>
</aside>
<div style="position: absolute; left: 40px; right: 40px; top: 650px">
<div style="position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1)">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{h.prog}}%; border-radius: 2px; background: rgba(245,245,247,0.6)"></div>
<span style="position: absolute; left: 16.7%; top: -8px; width: 2px; height: 20px; background: #F5F5F7"></span>
<span style="position: absolute; left: 25%; top: -8px; width: 2px; height: 20px; background: var(--accent)"></span>
</div>
<div style="position: relative; margin-top: 16px; height: 18px; font-size: 12px; font-weight: 600">
<span style="position: absolute; left: 16.7%; transform: translateX(-50%); color: rgba(245,245,247,0.7)">Y</span>
<span style="position: absolute; left: 25%; transform: translateX(-50%); color: var(--accent)">B</span>
</div>
<span style="display: block; margin-top: 14px; font-size: 14px; font-weight: 500; line-height: 1.5; color: rgba(245,245,247,0.7)">{{h.note}}</span>
</div>
</div>
</sc-for>
<div style="position: absolute; z-index: 45; left: 50%; top: 24px; transform: translateX(-50%) translateY({{keyTy}}px); display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(30,30,32,0.7); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transition: opacity 160ms ease, transform 260ms cubic-bezier(.32,.72,0,1)">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #F5F5F7; color: #000; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{keyGlyph}}</span>{{keyLabel}}
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 3600 }), 30);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const IN = 'transform 560ms cubic-bezier(.3,1.25,.4,1), opacity 240ms ease';
    const OUT = 'transform 260ms cubic-bezier(.4,0,1,1), opacity 200ms ease 60ms';
    const mk = (open) => ({ tx: open ? 0 : 340, op: open ? 1 : 0, tr: open ? IN : OUT, dim: open ? 0.55 : 1 });
    const bad = mk(t >= 600 && t < 1160);
    const good = mk(t >= 600 && t < 900);
    const prog = Math.min(100, (t / 3600) * 100);
    const keyY = t >= 520 && t < 820;
    const keyB = t >= 860 && t < 1300;
    return {
      accent: this.props.accent ?? '#F2802A',
      halves: [
        Object.assign({ x: 0, tag: 'À ÉVITER', tagColor: 'rgba(245,245,247,0.5)', title: 'L’animation va au bout', prog: prog,
          note: 'B arrive pendant l’ouverture : la feuille finit de s’ouvrir, puis se referme. La touche semble ignorée pendant 260 ms.' }, bad),
        Object.assign({ x: 640, tag: 'COCOOS', tagColor: 'var(--accent)', title: 'L’animation repart d’où elle est', prog: prog,
          note: 'La feuille fait demi-tour depuis sa position actuelle, avec la courbe de sortie. Chaque touche est prise en compte immédiatement.' }, good)
      ],
      keyOp: keyY || keyB ? 1 : 0,
      keyTy: keyY || keyB ? 0 : -8,
      keyGlyph: keyB ? 'B' : 'Y',
      keyLabel: keyB ? 'Fermer (pendant l’ouverture)' : 'Options'
    };
  }
}
</script>
</body>
</html>
