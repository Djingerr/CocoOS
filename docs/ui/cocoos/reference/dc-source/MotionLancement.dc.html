<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Lancement d'un jeu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoSpin{to{transform:rotate(360deg)}}
@keyframes cocoKen{0%{transform:scale(1.02) translate(0,0)}100%{transform:scale(1.1) translate(-20px,8px)}}
@keyframes cocoCloud{0%{transform:translateX(0)}100%{transform:translateX(-140px)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.85) 75%)"></div>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 560px">
<sc-for list="{{covers}}" as="c" hint-placeholder-count="6">
<div style="position: absolute; left: {{c.left}}px; top: {{c.top}}px; width: {{c.w}}px; height: {{c.h}}px; z-index: {{c.z}}; transform: {{c.transform}}; filter: {{c.filter}}; opacity: {{c.opacity}}; transition: {{c.tr}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{c.art}}; box-shadow: 0 20px 40px rgba(0,0,0,0.5)">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0) 45%)"></div>
<span style="position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600">{{c.title}}</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 520px; top: 442px; width: 240px; height: 340px; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{art}}; opacity: {{homeOp}}; transition: {{fadeTr}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>

<div style="position: absolute; z-index: 15; left: {{hero.left}}px; top: {{hero.top}}px; width: {{hero.w}}px; height: {{hero.h}}px; border-radius: {{hero.r}}px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,0.6); transition: {{hero.tr}}">
<div style="position: absolute; inset: 0; background: {{art}}; opacity: {{homeOp}}; transition: {{slowFade}}">
<span style="position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: rgba(245,245,247,0.55)">Jaquette Minecraft</span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{launchOp}}; transition: {{slowFade}}">
<div style="position: absolute; inset: 0; background: {{art}}; animation: cocoKen 14s ease-in-out infinite alternate">
<div style="position: absolute; left: -5%; right: -5%; bottom: 0; height: 58%; background: rgba(0,0,0,0.3); clip-path: polygon(0 55%, 14% 22%, 28% 48%, 44% 6%, 60% 44%, 76% 18%, 100% 50%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: -5%; right: -5%; bottom: 0; height: 36%; background: rgba(0,0,0,0.45); clip-path: polygon(0 45%, 20% 20%, 38% 52%, 56% 26%, 74% 58%, 90% 30%, 100% 44%, 100% 100%, 0 100%)"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.58)"></div>
<span style="position: absolute; right: 32px; top: 28px; font-size: 11px; font-weight: 500; color: rgba(245,245,247,0.4)">[Arrière-plan Playnite]</span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 516px; display: flex; flex-direction: column; align-items: center; opacity: {{homeOp}}; transform: translateY({{homeTy}}px); transition: {{fadeTr}}">
<span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05">Minecraft</span>
<span style="margin-top: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">Mojang Studios · 2011 · Bac à sable</span>
<div style="margin-top: 26px; display: flex; gap: 12px">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600; transform: scale({{press}}); box-shadow: {{pressRing}}; transition: {{pressTr}}"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 90px; opacity: {{homeOp}}; transition: {{fadeTr}}">
<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; top: 30px; right: 56px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent)"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500">4 ms</span></div>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span>
</div>
</div>

<div style="position: absolute; z-index: 20; left: 440px; top: 296px; width: 400px; display: flex; flex-direction: column; align-items: center; opacity: {{ldOp}}; transform: scale({{ldScale}}); filter: blur({{ldBlur}}px); transition: {{ldTr}}">
<div style="position: relative; width: 49.3px; height: 49.3px">
<div style="position: absolute; inset: 0; box-sizing: border-box; border: 8.8px solid {{track}}; border-radius: 50%"></div>
<svg aria-hidden="true" width="49.3" height="49.3" viewBox="0 0 49.3 49.3" style="position: absolute; inset: 0; opacity: {{spinOp}}; transition: opacity 200ms ease; animation: cocoSpin 1.1s linear infinite"><circle cx="24.65" cy="24.65" r="20.25" fill="none" stroke-width="8.8" stroke-linecap="round" stroke-dasharray="34 93.23" style="stroke: var(--accent)"></circle></svg>
<svg aria-hidden="true" width="49.3" height="49.3" viewBox="0 0 49.3 49.3" style="position: absolute; inset: 0"><circle cx="24.65" cy="24.65" r="20.25" fill="none" stroke-width="8.8" stroke-dasharray="127.23" transform="rotate(-90 24.65 24.65)" style="stroke: var(--accent); stroke-dashoffset: {{fullOff}}; transition: stroke-dashoffset 480ms cubic-bezier(.32,.72,0,1)"></circle></svg>
</div>
<span style="margin-top: 26px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Minecraft</span>
<div style="position: relative; width: 400px; height: 20px; margin-top: 8px">
<sc-for list="{{status}}" as="st" hint-placeholder-count="3">
<span style="position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.62); opacity: {{st.op}}; transform: translateY({{st.ty}}px); transition: opacity 300ms ease, transform 400ms cubic-bezier(.32,.72,0,1)">{{st.text}}</span>
</sc-for>
</div>
</div>

<div aria-hidden="true" style="position: absolute; z-index: 30; inset: 0; overflow: hidden; opacity: {{streamOp}}; transform: scale({{streamScale}}); transition: {{streamTr}}">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, #7FB6DE 0%, #BFDDF0 46%, #6E9F55 47%, #4C7A39 70%, #3A2B1D 100%)"></div>
<div style="position: absolute; left: 980px; top: 70px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #FFF6D6 0%, rgba(255,246,214,0) 70%)"></div>
<div style="position: absolute; left: 0; top: 90px; width: 1500px; height: 120px; animation: cocoCloud 20s linear infinite">
<div style="position: absolute; left: 200px; top: 10px; width: 180px; height: 40px; background: rgba(255,255,255,0.85)"></div>
<div style="position: absolute; left: 640px; top: 50px; width: 240px; height: 44px; background: rgba(255,255,255,0.8)"></div>
<div style="position: absolute; left: 1080px; top: 0; width: 160px; height: 36px; background: rgba(255,255,255,0.85)"></div>
</div>
<div style="position: absolute; left: -5%; right: -5%; bottom: 0; height: 60%; background: #3F6B2F; clip-path: polygon(0 40%, 12% 30%, 24% 42%, 38% 22%, 52% 38%, 66% 26%, 80% 40%, 100% 30%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: -5%; right: -5%; bottom: 0; height: 34%; background: #5A4128; clip-path: polygon(0 30%, 20% 24%, 40% 34%, 60% 20%, 80% 32%, 100% 22%, 100% 100%, 0 100%)"></div>
<span style="position: absolute; left: 0; right: 0; top: 390px; text-align: center; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7)">[Flux vidéo du jeu]</span>
</div>

<div style="position: absolute; z-index: 40; left: 0; right: 0; top: 24px; display: flex; justify-content: center; opacity: {{toastOp}}; transform: translateY({{toastTy}}px); transition: {{toastTr}}">
<div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 18px 0 14px; border-radius: 22px; background: rgba(28,28,30,0.72); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 12px 30px rgba(0,0,0,0.3); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); font-size: 13px; font-weight: 600">
<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>
<span>Connecté à PC-Salon</span>
<span style="width: 1px; height: 16px; background: rgba(255,255,255,0.16)"></span>
<span style="font-weight: 500; color: rgba(245,245,247,0.7); font-variant-numeric: tabular-nums">4 ms · 1080p · 60 i/s</span>
</div>
</div>

<div style="position: absolute; z-index: 45; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #F5F5F7; color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">A</span>Jouer
</div>

<div aria-hidden="true" style="position: absolute; z-index: 50; inset: 0; background: #000; opacity: {{curtain}}; transition: opacity 400ms ease-in-out"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 9000 }), 100);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const accent = this.props.accent ?? '#F2802A';
    const instant = t >= 8650;
    const home = t < 1200 || instant;
    const press = t >= 900 && t < 1150;
    const connect = t >= 2000 && t < 5600;
    const ready = t >= 5600 && t < 6100;
    const after = t >= 6100 && !instant;
    const stream = t >= 6100 && !instant;
    const toast = t >= 6700 && t < 8200;
    const E = 'cubic-bezier(.32,.72,0,1)';
    const ART = {
      mc: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      ce: 'radial-gradient(circle at 40% 30%, #F49AC1 0%, transparent 42%), radial-gradient(circle at 65% 75%, #6C4BD1 0%, transparent 52%), linear-gradient(160deg, #2B1B4F 0%, #0C0818 100%)',
      sv: 'radial-gradient(circle at 30% 30%, #F6D55C 0%, transparent 40%), radial-gradient(circle at 65% 70%, #6DBE45 0%, transparent 52%), linear-gradient(160deg, #2F6B3A 0%, #0E1E10 100%)',
      er: 'radial-gradient(circle at 50% 30%, #E8C46A 0%, transparent 38%), radial-gradient(circle at 40% 80%, #5C4520 0%, transparent 52%), linear-gradient(160deg, #2A2214 0%, #0A0805 100%)',
      ha: 'radial-gradient(circle at 45% 30%, #FF6B4A 0%, transparent 40%), radial-gradient(circle at 60% 78%, #8A1C1C 0%, transparent 52%), linear-gradient(160deg, #2A0B0B 0%, #090303 100%)'
    };
    const order = [['Hades', 'ha'], ['Celeste', 'ce'], ['Hollow Knight', 'hk'], null, ['Forza Horizon 5', 'fh'], ['Stardew Valley', 'sv'], ['Elden Ring', 'er']];
    const S = [[240, 340, 0, 1], [190, 269, 250, 0.6], [160, 227, 430, 0.38], [140, 198, 580, 0.2]];
    const covers = [];
    order.forEach((x, i) => {
      if (!x) return;
      const o = i - 3;
      const k = Math.abs(o);
      const z = S[k];
      const sg = Math.sign(o);
      const cx = 640 + sg * (z[2] + (home ? 0 : 360));
      covers.push({
        title: x[0], art: ART[x[1]], w: z[0], h: z[1],
        left: Math.round(cx - z[0] / 2), top: 436 - z[1], z: 10 - k,
        transform: 'perspective(900px) rotateY(' + (-sg * (38 + (k - 1) * 6)) + 'deg)',
        filter: 'brightness(' + z[3] + ')',
        opacity: home ? 1 : 0,
        tr: instant ? 'none' : 'left 650ms ' + E + ' ' + (k - 1) * 40 + 'ms, opacity 450ms ease ' + (k - 1) * 40 + 'ms'
      });
    });
    const hero = home
      ? { left: 520, top: 96, w: 240, h: 340, r: 12 }
      : { left: 0, top: 0, w: 1280, h: 800, r: 0 };
    hero.tr = instant ? 'none' : 'left 950ms ' + E + ' 120ms, top 950ms ' + E + ' 120ms, width 950ms ' + E + ' 120ms, height 950ms ' + E + ' 120ms, border-radius 950ms ' + E + ' 120ms';
    const sIdx = t < 3300 ? 0 : (t < 4500 ? 1 : 2);
    const texts = ['Réveil de PC-Salon…', 'Lancement de Minecraft…', 'Connexion au flux vidéo…'];
    const status = texts.map((x, i) => ({ text: x, op: i === sIdx ? 1 : 0, ty: i === sIdx ? 0 : (i < sIdx ? -8 : 8) }));
    const ldVisible = connect || ready;
    return {
      accent: accent,
      track: 'color-mix(in oklab, ' + accent + ' 30%, transparent)',
      art: ART.mc,
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      covers: covers,
      hero: hero,
      homeOp: home ? 1 : 0,
      homeTy: home ? 0 : 14,
      launchOp: home ? 0 : 1,
      fadeTr: instant ? 'none' : 'opacity 320ms ease, transform 420ms ' + E,
      slowFade: instant ? 'none' : 'opacity 800ms ease 250ms',
      press: press ? 0.94 : 1,
      pressRing: press ? '0 0 0 6px rgba(245,245,247,0.25)' : '0 0 0 0 rgba(245,245,247,0)',
      pressTr: press ? 'transform 110ms ease-out, box-shadow 110ms ease-out' : 'transform 480ms cubic-bezier(.3,1.6,.4,1), box-shadow 400ms ease',
      ldOp: ldVisible ? 1 : 0,
      ldScale: ldVisible ? 1 : (after ? 1.18 : 0.88),
      ldBlur: after ? 8 : 0,
      ldTr: instant ? 'none' : 'opacity 450ms ease, transform 650ms ' + E + ', filter 450ms ease',
      spinOp: connect ? 1 : 0,
      fullOff: (ready || after) ? 0 : 127.23,
      status: status,
      streamOp: stream ? 1 : 0,
      streamScale: stream ? 1 : 1.06,
      streamTr: instant ? 'none' : 'opacity 600ms ease, transform 1400ms ' + E,
      toastOp: toast ? 1 : 0,
      toastTy: toast ? 0 : -70,
      toastTr: toast ? 'opacity 300ms ease, transform 650ms cubic-bezier(.3,1.3,.4,1)' : 'opacity 300ms ease, transform 400ms ' + E,
      keyOp: t >= 700 && t < 1500 ? 1 : 0,
      keyTy: t >= 700 && t < 1500 ? 0 : 8,
      curtain: t >= 8350 ? 1 : 0
    };
  }
}
</script>
</body>
</html>
