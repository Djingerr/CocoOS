<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Menu en jeu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoCloud{0%{transform:translateX(0)}100%{transform:translateX(-300px)}}
@keyframes cocoWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cocoPan{0%{transform:translateX(0)}100%{transform:translateX(-120px)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -60px; filter: {{frameFilter}}; transition: filter 480ms cubic-bezier(.32,.72,0,1)">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, #7FB6DE 0%, #BFDDF0 46%, #6E9F55 47%, #4C7A39 70%, #3A2B1D 100%)"></div>
<div style="position: absolute; left: 1040px; top: 120px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #FFF6D6 0%, rgba(255,246,214,0) 70%)"></div>
<div style="position: absolute; left: 0; top: 140px; width: 1800px; height: 120px; animation: cocoCloud 16s linear infinite alternate; animation-play-state: {{play}}">
<div style="position: absolute; left: 240px; top: 10px; width: 180px; height: 40px; background: rgba(255,255,255,0.85)"></div>
<div style="position: absolute; left: 700px; top: 50px; width: 240px; height: 44px; background: rgba(255,255,255,0.8)"></div>
<div style="position: absolute; left: 1180px; top: 0; width: 160px; height: 36px; background: rgba(255,255,255,0.85)"></div>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 1600px; height: 60%; animation: cocoPan 12s ease-in-out infinite alternate; animation-play-state: {{play}}">
<div style="position: absolute; inset: 0; background: #3F6B2F; clip-path: polygon(0 40%, 12% 30%, 24% 42%, 38% 22%, 52% 38%, 66% 26%, 80% 40%, 100% 30%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56%; background: #5A4128; clip-path: polygon(0 30%, 20% 24%, 40% 34%, 60% 20%, 80% 32%, 100% 22%, 100% 100%, 0 100%)"></div>
</div>
<div style="position: absolute; left: 650px; top: 470px; width: 36px; height: 72px; background: #2E4E7A; animation: cocoWalk .6s ease-in-out infinite; animation-play-state: {{play}}"><div style="position: absolute; left: 4px; top: -28px; width: 28px; height: 28px; background: #C9A27A"></div></div>
<span style="position: absolute; left: 0; right: 0; top: 420px; text-align: center; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7)">[Flux vidéo du jeu]</span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,{{dim}}); transition: background 450ms ease"></div>

<div style="position: absolute; left: 264px; right: 264px; top: 72px; display: flex; justify-content: space-between; align-items: center; opacity: {{h.op}}; transform: translateY({{h.ty}}px); transition: {{h.tr}}">
<div style="display: flex; align-items: center; gap: 14px">
<div aria-hidden="true" style="width: 40px; height: 56px; border-radius: 6px; background: {{art}}; box-shadow: 0 0 0 1px rgba(255,255,255,0.12)"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Minecraft</span><span style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.65)">En pause · 1 h 24 min</span></div>
</div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 13px; font-weight: 600">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.6); font-weight: 500">4 ms</span></span>
<span style="font-size: 15px; font-variant-numeric: tabular-nums">{{time}}</span>
</div>
</div>

<div style="position: absolute; left: 264px; top: 152px; width: 752px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(5, 80px); gap: 16px">
<div style="grid-column: 1 / span 4; grid-row: 1 / span 2; box-sizing: border-box; padding: 22px; border-radius: 28px; background: #F5F5F7; color: #000; display: flex; flex-direction: column; justify-content: space-between; opacity: {{t1.op}}; transform: scale({{t1.sc}}); box-shadow: {{t1.ring}}; transition: {{t1.tr}}">
<span style="width: 52px; height: 52px; border-radius: 50%; background: #000; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 3.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7z" fill="#F5F5F7"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 28px; font-weight: 600; letter-spacing: -0.03em">Reprendre</span><span style="font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.55)">Retour au jeu</span></span>
</div>
<div style="grid-column: 5 / span 2; grid-row: 1 / span 4; position: relative; border-radius: 28px; overflow: hidden; background: rgba(255,255,255,0.1); border: 1px solid {{t2.border}}; opacity: {{t2.op}}; transform: scale({{t2.sc}}); box-shadow: {{t2.ring}}; transition: {{t2.tr}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: rgba(245,245,247,0.94)"></div>
<span style="position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 13px; font-weight: 600; color: #1C1C1E">Luminosité</span>
<span style="position: absolute; left: 0; right: 0; top: 38px; text-align: center; font-size: 12px; font-weight: 500; color: rgba(28,28,30,0.6)">100 %</span>
<svg width="26" height="26" viewBox="0 0 20 20" aria-hidden="true" style="position: absolute; left: 75px; bottom: 24px"><circle cx="10" cy="10" r="3.6" fill="#1C1C1E"></circle><g stroke="#1C1C1E" stroke-width="1.6" stroke-linecap="round"><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"></path></g></svg>
</div>
<div style="grid-column: 7 / span 2; grid-row: 1 / span 4; position: relative; border-radius: 28px; overflow: hidden; background: rgba(255,255,255,0.1); border: 1px solid {{t3.border}}; opacity: {{t3.op}}; transform: scale({{t3.sc}}); box-shadow: {{t3.ring}}; transition: {{t3.tr}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{vol}}%; background: rgba(245,245,247,0.94); transition: height 180ms cubic-bezier(.32,.72,0,1)"></div>
<span style="position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 13px; font-weight: 600">Volume</span>
<span style="position: absolute; left: 0; right: 0; top: 38px; text-align: center; font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.7); font-variant-numeric: tabular-nums">{{vol}} %</span>
<svg width="26" height="26" viewBox="0 0 20 20" aria-hidden="true" style="position: absolute; left: 75px; bottom: 24px"><path d="M3 7.5h3l4-3.2v11.4l-4-3.2H3z" fill="#1C1C1E"></path><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10" stroke="#1C1C1E" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
</div>
<div style="grid-column: 1 / span 2; grid-row: 3 / span 2; box-sizing: border-box; padding: 20px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: space-between; opacity: {{t4.op}}; transform: scale({{t4.sc}}); transition: {{t4.tr}}">
<span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="5" width="16" height="11.5" rx="2.5" fill="none" stroke="#F5F5F7" stroke-width="1.6"></rect><path d="M7 5l1.3-2h3.4L13 5" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linejoin="round"></path><circle cx="10" cy="10.7" r="3" fill="none" stroke="#F5F5F7" stroke-width="1.6"></circle></svg></span>
<span style="font-size: 15px; font-weight: 600">Capture</span>
</div>
<div style="grid-column: 3 / span 2; grid-row: 3 / span 2; box-sizing: border-box; padding: 20px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: space-between; opacity: {{t5.op}}; transform: scale({{t5.sc}}); transition: {{t5.tr}}">
<span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V10M10 16V4M16 16v-7" stroke="#F5F5F7" stroke-width="2.2" stroke-linecap="round"></path></svg></span>
<span style="font-size: 15px; font-weight: 600">Statistiques</span>
</div>
<div style="grid-column: 1 / span 2; grid-row: 5; box-sizing: border-box; padding: 0 16px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; opacity: {{t6.op}}; transform: scale({{t6.sc}}); transition: {{t6.tr}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linejoin="round"></path></svg>Accueil</div>
<div style="grid-column: 3 / span 2; grid-row: 5; box-sizing: border-box; padding: 0 16px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; opacity: {{t7.op}}; transform: scale({{t7.sc}}); transition: {{t7.tr}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#F5F5F7" stroke-width="1.6"></circle><path d="M7.4 7.4l5.2 5.2M12.6 7.4l-5.2 5.2" stroke="#F5F5F7" stroke-width="1.6" stroke-linecap="round"></path></svg>Quitter le jeu</div>
<div style="grid-column: 5 / span 2; grid-row: 5; box-sizing: border-box; padding: 0 16px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; opacity: {{t8.op}}; transform: scale({{t8.sc}}); transition: {{t8.tr}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z" fill="#F5F5F7"></path></svg>Veille</div>
<div style="grid-column: 7 / span 2; grid-row: 5; box-sizing: border-box; padding: 0 16px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; opacity: {{t9.op}}; transform: scale({{t9.sc}}); transition: {{t9.tr}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v7" stroke="#F5F5F7" stroke-width="1.8" stroke-linecap="round"></path><path d="M6 5.2a6.5 6.5 0 1 0 8 0" fill="none" stroke="#F5F5F7" stroke-width="1.8" stroke-linecap="round"></path></svg>Alimentation</div>
</div>

<div style="position: absolute; z-index: 45; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(30,30,32,0.6); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="min-width: 26px; height: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 13px; background: #F5F5F7; color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{keyGlyph}}</span>{{keyLabel}}
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 9000 }), 100);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const open = t >= 1500 && t < 6000;
    const E = 'cubic-bezier(.32,.72,0,1)';
    const SPRING = 'cubic-bezier(.3,1.25,.4,1)';
    let focus = 'resume';
    if (t >= 2600 && t < 3000) focus = 'lum';
    else if (t >= 3000 && t < 4900) focus = 'vol';
    else if (t >= 4900 && t < 5200) focus = 'lum';
    let vol = 30;
    if (t >= 3400 && t < 8600) vol = Math.min(60, 30 + 10 * (Math.floor((t - 3400) / 200) + 1));
    const press = t >= 5800 && t < 5950;
    const tile = (i, name) => {
      const f = open && focus === name;
      const sc = !open ? 0.9 : (name === 'resume' && press ? 0.95 : (f ? 1.03 : 1));
      return {
        op: open ? 1 : 0,
        sc: sc,
        border: f ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.1)',
        ring: f ? '0 0 0 4px rgba(245,245,247,0.28), 0 20px 50px rgba(0,0,0,0.4)' : '0 0 0 0 rgba(245,245,247,0)',
        tr: open
          ? 'opacity 380ms ease ' + i * 35 + 'ms, transform 560ms ' + SPRING + ' ' + (f || press ? 0 : i * 35) + 'ms, box-shadow 300ms ease, border-color 300ms ease'
          : 'opacity 220ms ease, transform 260ms ' + E + ', box-shadow 200ms ease'
      };
    };
    const keys = [
      [1200, 1700, '≡', 'Menu'], [2500, 2700, '▶', ''], [2900, 3100, '▶', ''], [3400, 4300, '▲', 'Volume +'],
      [4800, 5000, '◀', ''], [5100, 5300, '◀', ''], [5750, 6050, 'A', 'Reprendre']
    ];
    const k = keys.find((x) => t >= x[0] && t < x[1]);
    return {
      accent: this.props.accent ?? '#F2802A',
      art: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      play: open ? 'paused' : 'running',
      frameFilter: open ? 'blur(36px) brightness(0.6) saturate(1.2)' : 'blur(0px) brightness(1) saturate(1)',
      dim: open ? 0.25 : 0,
      h: { op: open ? 1 : 0, ty: open ? 0 : -10, tr: open ? 'opacity 380ms ease 60ms, transform 520ms ' + E + ' 60ms' : 'opacity 200ms ease, transform 260ms ease' },
      t1: tile(0, 'resume'), t2: tile(1, 'lum'), t3: tile(2, 'vol'), t4: tile(3, 'cap'), t5: tile(4, 'stats'),
      t6: tile(5, 'home'), t7: tile(6, 'quit'), t8: tile(7, 'sleep'), t9: tile(8, 'power'),
      vol: vol,
      keyOp: k ? 1 : 0,
      keyTy: k ? 0 : 8,
      keyGlyph: k ? k[2] : '',
      keyLabel: k ? k[3] : ''
    };
  }
}
</script>
</body>
</html>
