<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Catégories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -100px; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate">
<sc-for list="{{backdrops}}" as="b" hint-placeholder-count="0">
<div style="position: absolute; inset: 0; background: {{b.art}}; opacity: {{b.op}}; transition: opacity 800ms ease-in-out"></div>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.85) 75%)"></div>

<sc-for list="{{layers}}" as="L" hint-placeholder-count="1">
<div style="position: absolute; inset: 0; opacity: {{L.op}}; transform: translateX({{L.tx}}px); filter: blur({{L.blur}}px); transition: {{L.tr}}">
<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 560px">
<sc-for list="{{L.covers}}" as="c" hint-placeholder-count="5">
<div style="position: absolute; left: {{c.left}}px; top: {{c.top}}px; width: {{c.w}}px; height: {{c.h}}px; z-index: {{c.z}}; transform: {{c.transform}}; filter: {{c.filter}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{c.art}}; box-shadow: {{c.shadow}}">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0) 45%)"></div>
<sc-if value="{{c.monitor}}" hint-placeholder-val="{{false}}"><svg width="64" height="57" viewBox="0 0 18 16" aria-hidden="true" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%)"><rect x="1" y="1" width="16" height="10.5" rx="2" fill="none" stroke="#F5F5F7" stroke-width="1"></rect><path d="M6.5 15h5M9 11.5V15" stroke="#F5F5F7" stroke-width="1" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{c.pad}}" hint-placeholder-val="{{false}}"><svg width="70" height="51" viewBox="0 0 22 16" aria-hidden="true" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%)"><path d="M6 2h10a4 4 0 0 1 3.9 3.1l1 4.6a2.2 2.2 0 0 1-3.8 1.9L15 9.5H7l-2.1 2.1a2.2 2.2 0 0 1-3.8-1.9l1-4.6A4 4 0 0 1 6 2z" fill="none" stroke="#F5F5F7" stroke-width="1" stroke-linejoin="round"></path><path d="M7 4.5v3M5.5 6h3" stroke="#F5F5F7" stroke-width="1" stroke-linecap="round"></path><circle cx="15" cy="5" r="0.8" fill="#F5F5F7"></circle><circle cx="16.6" cy="6.8" r="0.8" fill="#F5F5F7"></circle></svg></sc-if>
<sc-if value="{{c.plus}}" hint-placeholder-val="{{false}}"><svg width="64" height="64" viewBox="0 0 20 20" aria-hidden="true" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%)"><circle cx="10" cy="10" r="8" fill="none" stroke="#F5F5F7" stroke-width="1"></circle><path d="M10 6v8M6 10h8" stroke="#F5F5F7" stroke-width="1.2" stroke-linecap="round"></path></svg></sc-if>
<span style="position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600">{{c.title}}</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; top: 516px; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05">{{L.title}}</span>
<span style="margin-top: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">{{L.meta}}</span>
</div>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 160px; height: 560px; background: linear-gradient(90deg, rgba(0,0,0,0.75), rgba(0,0,0,0))"></div>
<div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 160px; height: 560px; background: linear-gradient(270deg, rgba(0,0,0,0.75), rgba(0,0,0,0))"></div>

<div style="position: absolute; left: 0; right: 0; top: 620px; display: flex; justify-content: center; gap: 12px">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>{{playLabel}}</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>

<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; left: 0; right: 0; top: 28px; display: flex; justify-content: center">
<div style="display: flex; align-items: center; gap: 10px">
<span style="height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; border: 1px solid rgba(245,245,247,0.3); font-size: 10px; font-weight: 600; display: flex; align-items: center; background: {{lbBg}}; color: {{lbFg}}; transition: background 150ms ease, color 150ms ease">LB</span>
<nav aria-label="Catégories" style="position: relative; display: flex; padding: 4px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1)">
<span aria-hidden="true" style="position: absolute; top: 4px; bottom: 4px; left: {{pill.left}}px; width: {{pill.w}}px; border-radius: 16px; background: #F5F5F7; transform: scaleX({{pill.sx}}); transition: left 520ms cubic-bezier(.3,1.2,.4,1), width 520ms cubic-bezier(.3,1.2,.4,1), transform 200ms ease"></span>
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
<button style="position: relative; width: {{tb.w}}px; padding: 7px 0; border: none; border-radius: 16px; background: transparent; color: {{tb.color}}; font-family: inherit; font-size: 14px; font-weight: {{tb.weight}}; transition: color 260ms ease">{{tb.label}}</button>
</sc-for>
</nav>
<span style="height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; border: 1px solid rgba(245,245,247,0.3); font-size: 10px; font-weight: 600; display: flex; align-items: center; background: {{rbBg}}; color: {{rbFg}}; transition: background 150ms ease, color 150ms ease">RB</span>
</div>
</div>
<div style="position: absolute; top: 30px; right: 56px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500">4 ms</span></div>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span>
</div>

<div style="position: absolute; z-index: 45; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 13px; background: #F5F5F7; color: #000; display: flex; align-items: center; font-size: 11px; font-weight: 700">{{keyGlyph}}</span>{{keyLabel}}
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 8000 }), 50);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const E = 'cubic-bezier(.32,.72,0,1)';
    const cur = t < 1200 ? 0 : (t < 3200 ? 1 : (t < 5200 ? 2 : (t < 6600 ? 1 : 0)));
    const ART = {
      mc: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      ce: 'radial-gradient(circle at 40% 30%, #F49AC1 0%, transparent 42%), radial-gradient(circle at 65% 75%, #6C4BD1 0%, transparent 52%), linear-gradient(160deg, #2B1B4F 0%, #0C0818 100%)',
      sv: 'radial-gradient(circle at 30% 30%, #F6D55C 0%, transparent 40%), radial-gradient(circle at 65% 70%, #6DBE45 0%, transparent 52%), linear-gradient(160deg, #2F6B3A 0%, #0E1E10 100%)',
      er: 'radial-gradient(circle at 50% 30%, #E8C46A 0%, transparent 38%), radial-gradient(circle at 40% 80%, #5C4520 0%, transparent 52%), linear-gradient(160deg, #2A2214 0%, #0A0805 100%)',
      ha: 'radial-gradient(circle at 45% 30%, #FF6B4A 0%, transparent 40%), radial-gradient(circle at 60% 78%, #8A1C1C 0%, transparent 52%), linear-gradient(160deg, #2A0B0B 0%, #090303 100%)',
      cu: 'radial-gradient(circle at 40% 30%, #F2C14E 0%, transparent 42%), radial-gradient(circle at 65% 75%, #C9472E 0%, transparent 52%), linear-gradient(160deg, #3B2414 0%, #120A05 100%)',
      app1: 'linear-gradient(160deg, #3A3A3C 0%, #1C1C1E 100%)',
      app2: 'linear-gradient(160deg, #24384D 0%, #0F1A26 100%)',
      app3: 'linear-gradient(160deg, #4A4A4E 0%, #222224 100%)'
    };
    const CATS = [
      { label: 'Tout', w: 72, center: 3, title: 'Minecraft', meta: 'Mojang Studios · 2011 · Bac à sable', play: 'Jouer',
        items: [['Hades', 'ha'], ['Celeste', 'ce'], ['Hollow Knight', 'hk'], ['Minecraft', 'mc'], ['Forza Horizon 5', 'fh'], ['Stardew Valley', 'sv'], ['Elden Ring', 'er']] },
      { label: 'Favoris', w: 92, center: 2, title: 'Celeste', meta: 'Maddy Makes Games · 2018 · Plateforme', play: 'Jouer',
        items: [['Stardew Valley', 'sv'], ['Hades', 'ha'], ['Celeste', 'ce'], ['Hollow Knight', 'hk'], ['Minecraft', 'mc']] },
      { label: 'Récents', w: 96, center: 1, title: 'Forza Horizon 5', meta: 'Joué hier · 3 h 40 min', play: 'Jouer',
        items: [['Minecraft', 'mc'], ['Forza Horizon 5', 'fh'], ['Elden Ring', 'er'], ['Hades', 'ha'], ['Cuphead', 'cu']] },
      { label: 'Apps', w: 72, center: 1, title: 'Écran virtuel', meta: 'Bureau virtuel sur PC-Salon', play: 'Ouvrir',
        items: [['Bureau', 'app1', 'monitor'], ['Écran virtuel', 'app3', 'plus'], ['Steam', 'app2', 'pad']] }
    ];
    const S = [[240, 340, 0, 1], [190, 269, 250, 0.6], [160, 227, 430, 0.38], [140, 198, 580, 0.2]];
    const layers = CATS.map((cat, ci) => {
      const covers = cat.items.map((x, i) => {
        const o = i - cat.center;
        const k = Math.min(Math.abs(o), 3);
        const z = S[k];
        const sg = Math.sign(o);
        const cx = 640 + sg * z[2];
        return {
          title: x[0], art: ART[x[1]], monitor: x[2] === 'monitor', pad: x[2] === 'pad', plus: x[2] === 'plus',
          w: z[0], h: z[1], left: Math.round(cx - z[0] / 2), top: 436 - z[1], z: 10 - k,
          transform: 'perspective(900px) rotateY(' + (o === 0 ? 0 : -sg * (38 + (k - 1) * 6)) + 'deg)',
          filter: 'brightness(' + z[3] + ')',
          shadow: o === 0 ? '0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12)' : '0 20px 40px rgba(0,0,0,0.5)'
        };
      });
      const off = ci - cur;
      const active = off === 0;
      return {
        covers: covers, title: cat.title, meta: cat.meta,
        op: active ? 1 : 0,
        tx: active ? 0 : (off < 0 ? -140 : 140),
        blur: active ? 0 : 8,
        tr: active ? 'opacity 380ms ease 110ms, transform 640ms ' + E + ' 70ms, filter 380ms ease 110ms' : 'opacity 220ms ease, transform 320ms cubic-bezier(.4,0,1,1), filter 220ms ease'
      };
    });
    const centerArt = (c) => ART[c.items[c.center][1]];
    const backdrops = CATS.map((c, i) => ({ art: c.label === 'Apps' ? 'linear-gradient(160deg, #3A3A3C 0%, #111113 100%)' : centerArt(c), op: i === cur ? 1 : 0 }));
    let left = 4;
    for (let i = 0; i < cur; i++) left += CATS[i].w;
    const presses = [[1100, 'RB'], [3100, 'RB'], [5100, 'LB'], [6500, 'LB']];
    const pr = presses.find((p) => t >= p[0] && t < p[0] + 450);
    const squash = presses.some((p) => t >= p[0] + 100 && t < p[0] + 260);
    return {
      accent: this.props.accent ?? '#F2802A',
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      layers: layers,
      backdrops: backdrops,
      playLabel: CATS[cur].play,
      tabs: CATS.map((c, i) => ({ label: c.label, w: c.w, color: i === cur ? '#000' : 'rgba(245,245,247,0.72)', weight: i === cur ? 600 : 500 })),
      pill: { left: left, w: CATS[cur].w, sx: squash ? 1.06 : 1 },
      lbBg: pr && pr[1] === 'LB' ? '#F5F5F7' : 'transparent',
      lbFg: pr && pr[1] === 'LB' ? '#000' : 'rgba(245,245,247,0.6)',
      rbBg: pr && pr[1] === 'RB' ? '#F5F5F7' : 'transparent',
      rbFg: pr && pr[1] === 'RB' ? '#000' : 'rgba(245,245,247,0.6)',
      keyOp: pr ? 1 : 0,
      keyTy: pr ? 0 : 8,
      keyGlyph: pr ? pr[1] : '',
      keyLabel: pr && pr[1] === 'LB' ? 'Catégorie précédente' : 'Catégorie suivante'
    };
  }
}
</script>
</body>
</html>
