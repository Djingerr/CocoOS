<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Appairage avec le PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoSpin{to{transform:rotate(360deg)}}
@keyframes cocoGlow{0%,100%{opacity:.16;transform:translateX(-50%) scale(1)}50%{opacity:.26;transform:translateX(-50%) scale(1.06)}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; left: 50%; top: 520px; width: 1000px; height: 520px; border-radius: 50%; background: radial-gradient(ellipse, var(--accent) 0%, rgba(0,0,0,0) 65%); filter: blur(120px); animation: cocoGlow 10s ease-in-out infinite"></div>

<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; opacity: {{intro.op}}; transition: {{intro.tr}}">Coco<span style="color: var(--accent)">OS</span></div>

<div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: rgba(245,245,247,0.55); opacity: {{intro.op}}; transform: translateY({{intro.ty}}px); transition: {{intro.tr}}">PREMIÈRE CONFIGURATION · 2 SUR 3</div>

<div style="position: absolute; left: 0; right: 0; top: 180px; height: 90px">
<div style="position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: {{askTxt.op}}; transform: translateY({{askTxt.ty}}px); filter: blur({{askTxt.blur}}px); transition: {{askTxt.tr}}">
<span style="font-size: 32px; font-weight: 600; letter-spacing: -0.03em">Associez votre PC</span>
<span style="font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">Dans Apollo, sur PC-Salon, saisissez ce code :</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: {{okTxt.op}}; transform: translateY({{okTxt.ty}}px); filter: blur({{okTxt.blur}}px); transition: {{okTxt.tr}}">
<span style="font-size: 32px; font-weight: 600; letter-spacing: -0.03em">PC-Salon est associé</span>
<span style="font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">Tout est prêt. Votre bibliothèque arrive.</span>
</div>
</div>

<div style="position: absolute; left: 440px; top: 300px; width: 400px; height: 108px">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
<div style="position: absolute; left: {{b.left}}px; top: 0; width: 88px; height: 108px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; opacity: {{b.op}}; transform: translateX({{b.tx}}px) scale({{b.sc}}); transition: {{b.tr}}">
<span style="font-size: 56px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; opacity: {{b.dOp}}; transform: translateY({{b.dTy}}px); filter: blur({{b.dBlur}}px); transition: {{b.dTr}}">{{b.d}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 592px; top: 306px; width: 96px; height: 96px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 60px {{glow}}; opacity: {{check.op}}; transform: scale({{check.sc}}); transition: {{check.tr}}">
<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M11 23l7.5 7.5L33 15" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="34" style="stroke-dashoffset: {{check.off}}; transition: {{check.offTr}}"></path></svg>
</div>

<div style="position: absolute; left: 0; right: 0; top: 450px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.62); opacity: {{wait.op}}; transition: {{wait.tr}}">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="animation: cocoSpin 1s linear infinite"><circle cx="9" cy="9" r="7" fill="none" stroke-width="2.5" style="stroke: {{track}}"></circle><circle cx="9" cy="9" r="7" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 32" style="stroke: var(--accent)"></circle></svg>
En attente de PC-Salon…
</div>

<div style="position: absolute; left: 0; right: 0; top: 500px; display: flex; justify-content: center; opacity: {{cta.op}}; transform: translateY({{cta.ty}}px); filter: blur({{cta.blur}}px); transition: {{cta.tr}}">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Continuer</button>
</div>

<div aria-hidden="true" style="position: absolute; z-index: 50; inset: 0; background: #000; opacity: {{curtain}}; transition: opacity 450ms ease-in-out"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 10000 }), 50);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const accent = this.props.accent ?? '#F2802A';
    const E = 'cubic-bezier(.32,.72,0,1)';
    const instant = t >= 9500;
    const ok = t >= 5200 && !instant;
    const tr = (s) => (instant ? 'none' : s);
    const digits = ['4', '8', '2', '7'];
    const boxes = digits.map((dg, i) => {
      const shown = t >= 900 + i * 110 && !instant;
      return {
        d: dg,
        left: i * 104,
        op: ok ? 0 : (t >= 500 && !instant ? 1 : 0),
        tx: ok ? [156, 52, -52, -156][i] : 0,
        sc: ok ? 0.6 : (t >= 500 && !instant ? 1 : 0.92),
        tr: tr(ok ? 'transform 520ms ' + E + ' ' + (Math.abs(1.5 - i) * 40) + 'ms, opacity 360ms ease ' + (120 + Math.abs(1.5 - i) * 40) + 'ms' : 'opacity 400ms ease ' + i * 60 + 'ms, transform 600ms ' + E + ' ' + i * 60 + 'ms'),
        dOp: shown ? 1 : 0,
        dTy: shown ? 0 : 14,
        dBlur: shown ? 0 : 8,
        dTr: tr('opacity 360ms ease, transform 520ms cubic-bezier(.3,1.25,.4,1), filter 360ms ease')
      };
    });
    const intro = { op: instant ? 0 : 1, ty: instant ? 10 : 0, tr: tr('opacity 500ms ease, transform 600ms ' + E) };
    const swap = (vis, delay) => ({ op: vis ? 1 : 0, ty: vis ? 0 : (ok ? -12 : 12), blur: vis ? 0 : 6, tr: tr('opacity 380ms ease ' + delay + 'ms, transform 520ms ' + E + ' ' + delay + 'ms, filter 380ms ease ' + delay + 'ms') });
    return {
      accent: accent,
      track: 'color-mix(in oklab, ' + accent + ' 25%, transparent)',
      glow: 'color-mix(in oklab, ' + accent + ' 45%, transparent)',
      intro: intro,
      askTxt: swap(!ok && !instant, ok ? 0 : 150),
      okTxt: swap(ok, 160),
      boxes: boxes,
      check: {
        op: ok && t >= 5420 ? 1 : 0,
        sc: ok && t >= 5420 ? 1 : 0.4,
        tr: tr('opacity 250ms ease, transform 620ms cubic-bezier(.3,1.4,.4,1)'),
        off: ok && t >= 5700 ? 0 : 34,
        offTr: tr(ok ? 'stroke-dashoffset 420ms ' + E : 'none')
      },
      wait: { op: t >= 1500 && t < 5200 ? 1 : 0, tr: tr('opacity 300ms ease') },
      cta: { op: ok && t >= 6000 ? 1 : 0, ty: ok && t >= 6000 ? 0 : 16, blur: ok && t >= 6000 ? 0 : 6, tr: tr('opacity 420ms ease, transform 600ms ' + E + ', filter 420ms ease') },
      curtain: t >= 9000 ? 1 : 0
    };
  }
}
</script>
</body>
</html>
