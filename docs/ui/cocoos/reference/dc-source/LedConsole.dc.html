<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LED de la console</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes ledBreathSlow{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes ledBreath{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes ledDouble{0%,8%{opacity:1}9%,16%{opacity:.08}17%,25%{opacity:1}26%,100%{opacity:.08}}
@keyframes ledFast{0%,49%{opacity:1}50%,100%{opacity:.1}}
@keyframes ledPulseOnce{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.3)}60%,100%{opacity:1;transform:scale(1)}}
@keyframes ledFade{0%{opacity:1}100%{opacity:0}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<span style="position: absolute; left: 56px; top: 44px; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">LED de la console</span>
<span style="position: absolute; left: 56px; top: 90px; width: 520px; font-size: 14px; font-weight: 500; line-height: 1.5; color: rgba(245,245,247,0.6)">Une seule LED à côté du bouton power. Elle reprend les couleurs et les rythmes de l’écran : l’accent pour la charge, le blanc pour le système, la respiration de 2,4 s du point « en ligne ».</span>

<div style="position: absolute; left: 56px; top: 230px; width: 620px; height: 300px; border-radius: 70px; background: linear-gradient(180deg, #1B1B1D, #0E0E10); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06)">
<div style="position: absolute; left: 140px; top: 34px; width: 340px; height: 232px; border-radius: 14px; background: #000; border: 1px solid rgba(255,255,255,0.05)"></div>
<div style="position: absolute; left: 48px; top: 70px; width: 56px; height: 56px; border-radius: 50%; background: #151517; border: 1px solid rgba(255,255,255,0.06)"></div>
<div style="position: absolute; left: 518px; top: 70px; width: 56px; height: 56px; border-radius: 50%; background: #151517; border: 1px solid rgba(255,255,255,0.06)"></div>
<div style="position: absolute; left: 64px; top: 170px; width: 24px; height: 24px; border-radius: 6px; background: #151517"></div>
<div style="position: absolute; left: 520px; top: 160px; display: grid; grid-template-columns: repeat(3, 16px); gap: 4px"><span></span><span style="width: 16px; height: 16px; border-radius: 50%; background: #151517"></span><span></span><span style="width: 16px; height: 16px; border-radius: 50%; background: #151517"></span><span></span><span style="width: 16px; height: 16px; border-radius: 50%; background: #151517"></span><span></span><span style="width: 16px; height: 16px; border-radius: 50%; background: #151517"></span><span></span></div>
<div style="position: absolute; left: 470px; top: -10px; width: 46px; height: 12px; border-radius: 4px; background: #232326"></div>
<div style="position: absolute; left: 534px; top: -6px; width: 10px; height: 4px; border-radius: 2px; background: {{led.color}}; box-shadow: 0 0 10px 2px {{led.glow}}; animation: {{led.anim}}"></div>
<span style="position: absolute; left: 470px; top: -34px; font-size: 11px; font-weight: 500; color: rgba(245,245,247,0.45)">power · LED</span>
</div>
<div style="position: absolute; left: 56px; top: 560px; width: 620px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">{{led.title}}</span>
<span style="font-size: 14px; font-weight: 500; line-height: 1.5; color: rgba(245,245,247,0.65)">{{led.desc}}</span>
</div>

<div style="position: absolute; left: 740px; top: 120px; width: 484px; border-radius: 20px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.06); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="height: 66px; padding: 0 18px; display: flex; align-items: center; gap: 14px; background: {{r.bg}}; border-top: 1px solid rgba(255,255,255,0.06); transition: background 300ms ease">
<span style="width: 12px; height: 12px; border-radius: 50%; background: {{r.color}}; box-shadow: 0 0 8px {{r.glow}}; flex: none"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: {{r.fw}}">{{r.title}}</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">{{r.rhythm}}</span></span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 24000 }), 100);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const accent = this.props.accent ?? '#F2802A';
    const W = '#F5F5F7', R = '#FF453A', B = '#6E9BFF';
    const S = [
      { title: 'Allumée, en jeu', rhythm: 'Éteinte', color: '#2A2A2C', glow: 'transparent', anim: 'none', desc: 'Pendant l’utilisation la LED reste éteinte : rien ne doit distraire de l’écran.' },
      { title: 'En charge', rhythm: 'Accent, respiration lente 4 s', color: accent, glow: accent, anim: 'ledBreathSlow 4s ease-in-out infinite', desc: 'Câble branché, console allumée ou éteinte. La respiration ralentit à mesure que la batterie se remplit.' },
      { title: 'Chargée', rhythm: 'Blanc fixe, s’éteint après 30 s', color: W, glow: W, anim: 'ledFade 30s linear forwards', desc: 'Batterie pleine avec le câble branché. La LED s’éteint d’elle-même pour ne pas éclairer une pièce sombre.' },
      { title: 'En veille', rhythm: 'Blanc, respiration 2,4 s', color: W, glow: W, anim: 'ledBreath 2.4s ease-in-out infinite', desc: 'Même rythme que le point « en ligne » de l’interface. Un appui court sur power réveille la console.' },
      { title: 'Batterie faible', rhythm: 'Accent, double clignement toutes les 3 s', color: accent, glow: accent, anim: 'ledDouble 3s linear infinite', desc: 'Sous 15 %, en même temps que la bannière « Batterie faible ». Sous 5 %, la LED passe en rouge.' },
      { title: 'Batterie critique', rhythm: 'Rouge, double clignement toutes les 3 s', color: R, glow: R, anim: 'ledDouble 3s linear infinite', desc: 'Sous 5 % : mise en veille automatique dans 2 minutes si aucun câble n’est branché.' },
      { title: 'Appairage Bluetooth', rhythm: 'Bleu, clignement rapide 0,5 s', color: B, glow: B, anim: 'ledFast .5s linear infinite', desc: 'Pendant la recherche d’une manette. Un éclat unique confirme l’association.' },
      { title: 'Mise à jour', rhythm: 'Blanc, éclat à chaque étape', color: W, glow: W, anim: 'ledPulseOnce 1.2s cubic-bezier(.3,1.25,.4,1) infinite', desc: 'Pendant l’installation, écran éteint ou allumé. Ne pas débrancher.' }
    ];
    const cur = Math.floor(t / 3000) % S.length;
    const led = S[cur];
    return {
      accent: accent,
      led: led,
      rows: S.map((s, i) => ({ title: s.title, rhythm: s.rhythm, color: s.color, glow: s.glow === 'transparent' ? 'transparent' : s.glow,
        bg: i === cur ? 'rgba(255,255,255,0.12)' : 'transparent', fw: i === cur ? 600 : 500 }))
    };
  }
}
</script>
</body>
</html>
