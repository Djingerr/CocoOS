<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Réveil du PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoSpin{to{transform:rotate(360deg)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.85) 75%)"></div>
<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 560px">
<sc-for list="{{covers}}" as="c" hint-placeholder-count="7">
<div style="position: absolute; left: {{c.left}}px; top: {{c.top}}px; width: {{c.w}}px; height: {{c.h}}px; z-index: {{c.z}}; transform: {{c.transform}}; filter: {{c.filter}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{c.art}}; box-shadow: {{c.shadow}}">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0) 45%)"></div>
<span style="position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600">{{c.title}}</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; top: 516px; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05">Minecraft</span>
<span style="margin-top: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">Mojang Studios · 2011 · Bac à sable</span>
<div style="margin-top: 26px; display: flex; gap: 12px">
<button style="position: relative; width: 196px; height: 52px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600; overflow: hidden; transform: scale({{press}}); transition: {{pressTr}}">
<span style="position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding-left: 11px; opacity: {{btn.playOp}}; transform: translateY({{btn.playTy}}px); transition: opacity 260ms ease, transform 420ms cubic-bezier(.32,.72,0,1)"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</span>
<span style="position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding-left: 11px; font-size: 15px; opacity: {{btn.wakeOp}}; transform: translateY({{btn.wakeTy}}px); transition: opacity 260ms ease, transform 420ms cubic-bezier(.32,.72,0,1)"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" style="animation: cocoSpin 1s linear infinite"><circle cx="9" cy="9" r="7" fill="none" stroke="rgba(245,245,247,0.25)" stroke-width="2.4"></circle><circle cx="9" cy="9" r="7" fill="none" stroke="#F5F5F7" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="12 32"></circle></svg></span>Réveil du PC…</span>
</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>
</div>
<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<span style="position: absolute; top: 36px; right: 56px; font-size: 15px; font-weight: 600; line-height: 20px; font-variant-numeric: tabular-nums">{{time}}</span>

<div role="status" aria-label="{{aria}}" style="position: absolute; top: 30px; right: 122px; width: {{pill.w}}px; height: 32px; border-radius: 16px; background: {{pill.bg}}; border: 1px solid rgba(255,255,255,0.12); overflow: hidden; transform: scale({{pill.sc}}); transform-origin: 100% 50%; transition: width 560ms cubic-bezier(.3,1.15,.4,1), background 400ms ease, transform 240ms ease">
<sc-for list="{{layers}}" as="l" hint-placeholder-count="4">
<div style="position: absolute; left: 14px; top: 0; height: 32px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; font-weight: 600; opacity: {{l.op}}; filter: blur({{l.blur}}px); transition: opacity 260ms ease {{l.delay}}ms, filter 260ms ease {{l.delay}}ms">
<sc-if value="{{l.dot}}" hint-placeholder-val="{{true}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{l.dotColor}}; animation: {{l.dotAnim}}"></span></sc-if>
<sc-if value="{{l.spin}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 18 18" aria-hidden="true" style="animation: cocoSpin 1s linear infinite"><circle cx="9" cy="9" r="7" fill="none" stroke-width="2.6" style="stroke: {{track}}"></circle><circle cx="9" cy="9" r="7" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="12 32" style="stroke: var(--accent)"></circle></svg></sc-if>
<sc-if value="{{l.check}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" style="fill: var(--accent)"></circle><path d="M6 10.4l2.6 2.6L14 7.6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<span>{{l.main}}</span><span style="font-weight: 500; color: rgba(245,245,247,0.58)">{{l.sub}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; z-index: 45; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #F5F5F7; color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">A</span>Jouer
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 9000 }), 50);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const accent = this.props.accent ?? '#F2802A';
    const st = t < 1300 || t >= 8400 ? 'asleep' : (t < 4300 ? 'waking' : (t < 5400 ? 'online' : 'normal'));
    const ART = {
      mc: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      ce: 'radial-gradient(circle at 40% 30%, #F49AC1 0%, transparent 42%), radial-gradient(circle at 65% 75%, #6C4BD1 0%, transparent 52%), linear-gradient(160deg, #2B1B4F 0%, #0C0818 100%)',
      sv: 'radial-gradient(circle at 30% 30%, #F6D55C 0%, transparent 40%), radial-gradient(circle at 65% 70%, #6DBE45 0%, transparent 52%), linear-gradient(160deg, #2F6B3A 0%, #0E1E10 100%)',
      er: 'radial-gradient(circle at 50% 30%, #E8C46A 0%, transparent 38%), radial-gradient(circle at 40% 80%, #5C4520 0%, transparent 52%), linear-gradient(160deg, #2A2214 0%, #0A0805 100%)',
      ha: 'radial-gradient(circle at 45% 30%, #FF6B4A 0%, transparent 40%), radial-gradient(circle at 60% 78%, #8A1C1C 0%, transparent 52%), linear-gradient(160deg, #2A0B0B 0%, #090303 100%)'
    };
    const order = [['Hades', 'ha'], ['Celeste', 'ce'], ['Hollow Knight', 'hk'], ['Minecraft', 'mc'], ['Forza Horizon 5', 'fh'], ['Stardew Valley', 'sv'], ['Elden Ring', 'er']];
    const S = [[240, 340, 0, 1], [190, 269, 250, 0.6], [160, 227, 430, 0.38], [140, 198, 580, 0.2]];
    const covers = order.map((x, i) => {
      const o = i - 3;
      const k = Math.abs(o);
      const z = S[k];
      const sg = Math.sign(o);
      const cx = 640 + sg * z[2];
      return {
        title: x[0], art: ART[x[1]], w: z[0], h: z[1], left: Math.round(cx - z[0] / 2), top: 436 - z[1], z: 10 - k,
        transform: 'perspective(900px) rotateY(' + (o === 0 ? 0 : -sg * (38 + (k - 1) * 6)) + 'deg)',
        filter: 'brightness(' + z[3] + ')',
        shadow: o === 0 ? '0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12)' : '0 20px 40px rgba(0,0,0,0.5)'
      };
    });
    const L = [
      { key: 'asleep', main: 'PC-Salon', sub: 'En veille', dot: true, dotColor: 'rgba(245,245,247,0.4)', dotAnim: 'none', spin: false, check: false },
      { key: 'waking', main: 'Réveil de PC-Salon…', sub: '', dot: false, spin: true, check: false, dotColor: '', dotAnim: 'none' },
      { key: 'online', main: 'PC-Salon est en ligne', sub: '', dot: false, spin: false, check: true, dotColor: '', dotAnim: 'none' },
      { key: 'normal', main: 'PC-Salon', sub: '4 ms', dot: true, dotColor: accent, dotAnim: 'cocoLive 2.4s ease-in-out infinite', spin: false, check: false }
    ];
    const layers = L.map((l) => Object.assign({}, l, { op: l.key === st ? 1 : 0, blur: l.key === st ? 0 : 4, delay: l.key === st ? 140 : 0 }));
    const widths = { asleep: 172, waking: 204, online: 218, normal: 146 };
    const bump = t >= 4300 && t < 4520;
    const press = t >= 1150 && t < 1300;
    return {
      accent: accent,
      track: 'color-mix(in oklab, ' + accent + ' 25%, transparent)',
      art: ART.mc,
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      covers: covers,
      layers: layers,
      pill: { w: widths[st], sc: bump ? 1.06 : 1, bg: st === 'online' ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.08)' },
      aria: { asleep: 'PC-Salon en veille', waking: 'Réveil de PC-Salon', online: 'PC-Salon est en ligne', normal: 'PC-Salon, 4 ms' }[st],
      btn: {
        playOp: st === 'waking' ? 0 : 1, playTy: st === 'waking' ? -12 : 0,
        wakeOp: st === 'waking' ? 1 : 0, wakeTy: st === 'waking' ? 0 : 12
      },
      press: press ? 0.94 : 1,
      pressTr: press ? 'transform 110ms ease-out' : 'transform 480ms cubic-bezier(.3,1.6,.4,1)',
      keyOp: t >= 900 && t < 1500 ? 1 : 0,
      keyTy: t >= 900 && t < 1500 ? 0 : 8
    };
  }
}
</script>
</body>
</html>
