<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche dans la bibliothèque</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.1) translate(0,0)}100%{transform:scale(1.18) translate(-30px,14px)}}
@keyframes cocoCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -100px; background: {{bg}}; filter: blur(110px) saturate(1.1); opacity: 0.75; animation: cocoBgPan 50s ease-in-out infinite alternate"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.8) 70%)"></div>

<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; top: 30px; right: 56px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500">4 ms</span></div>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">21:42</span>
<svg width="17" height="12" viewBox="0 0 18 13" aria-hidden="true"><circle cx="9" cy="11" r="1.6" fill="#F5F5F7"></circle><path d="M5.3 7.6a5.2 5.2 0 0 1 7.4 0" stroke="#F5F5F7" stroke-width="1.8" fill="none" stroke-linecap="round"></path><path d="M2.2 4.6a9.6 9.6 0 0 1 13.6 0" stroke="#F5F5F7" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<svg width="25" height="12" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#F5F5F7" stroke-opacity="0.45"></rect><rect x="2" y="2" width="16.4" height="9" rx="2" fill="#F5F5F7"></rect><rect x="24.8" y="4.5" width="1.6" height="4" rx="0.8" fill="#F5F5F7" fill-opacity="0.45"></rect></svg>
</div>

<div role="search" style="position: absolute; left: 280px; top: 86px; width: 720px; height: 56px; box-sizing: border-box; padding: 0 18px 0 20px; border-radius: 28px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; align-items: center; gap: 12px">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.6" cy="7.6" r="5.6" stroke="rgba(245,245,247,0.6)" stroke-width="2" fill="none"></circle><path d="M12 12l4.4 4.4" stroke="rgba(245,245,247,0.6)" stroke-width="2" stroke-linecap="round"></path></svg>
<div style="flex: 1; display: flex; align-items: center; font-size: 19px; font-weight: 500"><span>{{query}}</span><span style="width: 2px; height: 24px; margin-left: 2px; border-radius: 1px; background: var(--accent); animation: cocoCaret 1s infinite"></span></div>
<span style="width: 22px; height: 22px; border-radius: 50%; background: rgba(245,245,247,0.3); display: flex; align-items: center; justify-content: center"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round"></path></svg></span>
</div>

<div style="position: absolute; left: 72px; top: 166px; display: flex; align-items: baseline; gap: 12px"><span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em">{{resultTitle}}</span><span style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.5)">titres, éditeurs et genres</span></div>
<div style="position: absolute; left: 72px; top: 200px; display: flex; gap: 24px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="4">
<div style="width: 120px; display: flex; flex-direction: column; gap: 10px">
<div style="width: 120px; height: 170px; border-radius: 10px; background: {{r.art}}; box-shadow: 0 14px 30px rgba(0,0,0,0.45); position: relative; overflow: hidden"><div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 45%)"></div></div>
<span style="font-size: 13px; font-weight: 500; line-height: 1.3; color: rgba(245,245,247,0.86); white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 600; color: var(--accent)">{{r.hit}}</span>{{r.rest}}</span>
<span style="margin-top: -6px; font-size: 11px; font-weight: 500; color: rgba(245,245,247,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.why}}</span>
</div>
</sc-for>
</div>
<div style="position: absolute; right: 72px; top: 206px; width: 300px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: rgba(245,245,247,0.5)">RECHERCHES RÉCENTES</span>
<sc-for list="{{recent}}" as="q" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 10px; height: 36px; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.78)"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" stroke="rgba(245,245,247,0.45)" stroke-width="1.4" fill="none"></circle><path d="M8 4.6V8l2.4 1.6" stroke="rgba(245,245,247,0.45)" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>{{q}}</span>
</sc-for>
</div>

<div role="group" aria-label="Clavier" style="position: absolute; left: 50px; top: 440px; width: 1180px; height: 344px; border-radius: 32px; background: rgba(28,28,30,0.8); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 80px rgba(0,0,0,0.5); backdrop-filter: blur(40px) saturate(1.6); -webkit-backdrop-filter: blur(40px) saturate(1.6)">
<div style="position: absolute; left: 36px; right: 36px; top: 18px; height: 32px; display: flex; align-items: center; gap: 8px">
<sc-for list="{{suggest}}" as="s" hint-placeholder-count="3">
<span style="height: 32px; padding: 0 16px; box-sizing: border-box; border-radius: 16px; background: rgba(255,255,255,0.08); display: flex; align-items: center; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.82)">{{s}}</span>
</sc-for>
<span style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: rgba(245,245,247,0.5)"><span style="height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; border: 1px solid rgba(245,245,247,0.3); font-size: 10px; display: flex; align-items: center">↑</span>Suggestions</span>
</div>
<sc-for list="{{keys}}" as="k" hint-placeholder-count="38">
<div style="position: absolute; left: {{k.x}}px; top: {{k.y}}px; width: {{k.w}}px; height: 52px; box-sizing: border-box; border-radius: 13px; background: {{k.bg}}; color: {{k.fg}}; box-shadow: {{k.shadow}}; transform: scale({{k.sc}}); z-index: {{k.z}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: {{k.fs}}px; font-weight: {{k.fw}}">
<sc-if value="{{k.isIcon}}" hint-placeholder-val="{{false}}"><svg width="24" height="20" viewBox="0 0 24 20" aria-hidden="true"><path d="{{k.path}}" style="stroke: {{k.fg}}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{k.hasLabel}}" hint-placeholder-val="{{true}}"><span>{{k.label}}</span></sc-if>
</div>
</sc-for>
<div style="position: absolute; left: 36px; right: 36px; bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 26px; font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.6)">
<sc-for list="{{hints}}" as="h" hint-placeholder-count="5">
<span style="display: flex; align-items: center; gap: 8px"><span style="min-width: 22px; height: 22px; padding: 0 {{h.pad}}px; box-sizing: border-box; border-radius: 11px; border: 1px solid rgba(245,245,247,0.45); display: flex; align-items: center; justify-content: center; font-size: {{h.fs}}px; font-weight: 600; color: #F5F5F7">{{h.g}}</span>{{h.t}}</span>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"etat":{"editor":"enum","default":"résultats","options":["résultats","aucun résultat"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F2802A';
    const none = (this.props.etat ?? 'résultats') === 'aucun résultat';
    const ART = {
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      hz: 'radial-gradient(circle at 60% 28%, #F3B26B 0%, transparent 38%), radial-gradient(circle at 30% 75%, #2F6E74 0%, transparent 52%), linear-gradient(160deg, #3A3226 0%, #0B0F10 100%)',
      ha: 'radial-gradient(circle at 50% 30%, #E2533A 0%, transparent 42%), radial-gradient(circle at 60% 80%, #4B1020 0%, transparent 50%), linear-gradient(160deg, #2A0B10 0%, #080304 100%)'
    };
    const results = none ? [] : [
      { art: ART.hk, hit: 'Ho', rest: 'llow Knight', why: 'Team Cherry · 2017' },
      { art: ART.hz, hit: 'Ho', rest: 'rizon Zero Dawn', why: 'Guerrilla · 2017' },
      { art: ART.fh, hit: '', rest: 'Forza Horizon 5', why: 'titre contient « ho »' },
      { art: ART.ha, hit: '', rest: 'Hades', why: 'genre : action rogue-lite' }
    ];
    const L = [['a','z','e','r','t','y','u','i','o','p'], ['q','s','d','f','g','h','j','k','l','m'], ['w','x','c','v','b','n','’']];
    const KW = 100, G = 12, X0 = 36, Y0 = 62, RH = 60;
    const focus = 'l';
    const keys = [];
    const push = (x, row, w, o) => keys.push(Object.assign({ x: x, y: Y0 + row * RH, w: w, isIcon: false, hasLabel: true, path: '' }, o));
    L[0].forEach((c, i) => push(X0 + i * (KW + G), 0, KW, { label: c, kind: 'char', id: c }));
    L[1].forEach((c, i) => push(X0 + i * (KW + G), 1, KW, { label: c, kind: 'char', id: c }));
    push(X0, 2, 156, { kind: 'fn', isIcon: true, hasLabel: false, path: 'M12 3 4 11h4.5v6h7v-6H20z', id: 'shift' });
    L[2].forEach((c, i) => push(X0 + 156 + G + i * (KW + G), 2, KW, { label: c, kind: 'char', id: c }));
    push(X0 + 156 + G + 7 * (KW + G), 2, 156, { kind: 'fn', isIcon: true, hasLabel: false, path: 'M8.5 4H21v12H8.5L3 10zM12 7.5l5 5M17 7.5l-5 5', id: 'del' });
    let x = X0;
    push(x, 3, 156, { label: '123', kind: 'fn', id: '123' }); x += 156 + G;
    push(x, 3, KW, { label: '#+=', kind: 'fn', id: 'sym' }); x += KW + G;
    push(x, 3, 604, { label: 'espace', kind: 'fn', id: 'space' }); x += 604 + G;
    push(x, 3, 212, { label: 'Rechercher', kind: 'ok', id: 'ok' });
    const out = keys.map((k) => {
      const f = k.id === focus;
      let bg = k.kind === 'char' ? 'rgba(255,255,255,0.11)' : 'rgba(255,255,255,0.055)';
      let fg = '#F5F5F7';
      if (k.kind === 'ok') { bg = accent; fg = '#1B0E04'; }
      if (f) { bg = '#F5F5F7'; fg = '#000'; }
      return Object.assign({}, k, { bg: bg, fg: fg, sc: f ? 1.08 : 1, z: f ? 2 : 1,
        shadow: f ? '0 12px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.4)' : 'none',
        fs: k.kind === 'char' ? 24 : 15, fw: k.kind === 'char' ? 500 : 600 });
    });
    return {
      accent: accent,
      bg: ART.hk,
      query: none ? 'zelda' : 'ho',
      resultTitle: none ? 'Aucun jeu ne correspond à « zelda »' : '4 résultats',
      results: results,
      recent: ['minecraft', 'celeste', 'course'],
      suggest: none ? ['Vérifier l’orthographe', 'Chercher dans Playnite'] : ['hollow', 'horizon', 'hollow knight'],
      keys: out,
      hints: [
        { g: 'X', t: 'Effacer', pad: 0, fs: 11 },
        { g: 'Y', t: 'Espace', pad: 0, fs: 11 },
        { g: 'LT', t: 'Majuscule', pad: 6, fs: 10 },
        { g: '≡', t: 'Voir les résultats', pad: 0, fs: 12 },
        { g: 'B', t: 'Fermer', pad: 0, fs: 11 }
      ]
    };
  }
}
</script>
</body>
</html>
