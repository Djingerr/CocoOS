<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Réveil depuis la veille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoGlow{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{homeOp}}; transition: {{bgTr}}">
<div style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.85) 75%)"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 540px; width: 1100px; height: 560px; border-radius: 50%; background: radial-gradient(ellipse, var(--accent) 0%, rgba(0,0,0,0) 65%); filter: blur(120px); opacity: {{glowOp}}; animation: cocoGlow 14s ease-in-out infinite; transition: {{bgTr}}"></div>
<svg aria-hidden="true" width="1280" height="800" style="position: absolute; left: 0; top: 0; opacity: 0.07; mix-blend-mode: overlay"><filter id="grainRv"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1280" height="800" filter="url(#grainRv)"></rect></svg>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 560px">
<sc-for list="{{covers}}" as="c" hint-placeholder-count="6">
<div style="position: absolute; left: {{c.left}}px; top: {{c.top}}px; width: {{c.w}}px; height: {{c.h}}px; z-index: {{c.z}}; transform: {{c.transform}}; filter: {{c.filter}}; opacity: {{c.opacity}}; transition: {{c.tr}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{c.art}}; box-shadow: {{c.shadow}}">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0) 45%)"></div>
<span style="position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600">{{c.title}}</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; top: 516px; display: flex; flex-direction: column; align-items: center; opacity: {{r1.op}}; transform: translateY({{r1.ty}}px); filter: blur({{r1.blur}}px); transition: {{r1.tr}}">
<span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05">Minecraft</span>
<span style="margin-top: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">Mojang Studios · 2011 · Bac à sable</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: 620px; display: flex; justify-content: center; gap: 12px; opacity: {{r2.op}}; transform: translateY({{r2.ty}}px); filter: blur({{r2.blur}}px); transition: {{r2.tr}}">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; gap: 28px; font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.55); opacity: {{r3.op}}; transition: {{r3.tr}}"><span>◀ ▶ Parcourir</span><span>↓ Plus d'infos</span></div>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 90px; opacity: {{tb.op}}; transform: translateY({{tb.ty}}px); transition: {{tb.tr}}">
<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; left: 0; right: 0; top: 28px; display: flex; justify-content: center">
<nav aria-label="Catégories" style="display: flex; padding: 4px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1)">
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 14px; font-weight: 600">Tout</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Favoris</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Récents</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Apps</button>
</nav>
</div>
<div style="position: absolute; top: 30px; right: 159px; display: flex; align-items: center; height: 32px; padding: 0 14px; gap: 8px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500">4 ms</span></div>
<svg width="25" height="12" viewBox="0 0 27 13" aria-hidden="true" style="position: absolute; right: 56px; top: 40px"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#F5F5F7" stroke-opacity="0.45"></rect><rect x="2" y="2" width="16.4" height="9" rx="2" fill="#F5F5F7"></rect><rect x="24.8" y="4.5" width="1.6" height="4" rx="0.8" fill="#F5F5F7" fill-opacity="0.45"></rect></svg>
</div>
<span style="position: absolute; right: 99px; top: 36px; font-size: 15px; font-weight: 600; line-height: 20px; font-variant-numeric: tabular-nums; opacity: {{small.op}}; transition: {{small.tr}}">{{time}}</span>

<div style="position: absolute; left: 0; right: 0; top: 140px; display: flex; justify-content: center; font-size: 20px; font-weight: 600; color: rgba(245,245,247,0.6); opacity: {{idle.op}}; transform: translateY({{idle.ty}}px); filter: blur({{idle.blur}}px); transition: {{idle.tr}}">{{date}}</div>
<div style="position: absolute; left: 0; right: 0; top: 176px; height: 176px; display: flex; justify-content: center; transform-origin: 50% 50%; transform: {{clock.transform}}; opacity: {{clock.op}}; transition: {{clock.tr}}">
<span style="font-size: 176px; font-weight: 600; letter-spacing: -0.055em; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #FFFFFF 0%, #A9A9AE 100%); -webkit-background-clip: text; background-clip: text; color: transparent">{{time}}</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: 500px; display: flex; justify-content: center; opacity: {{idle.op}}; transform: scale({{capScale}}); filter: blur({{idle.blur}}px); transition: {{idle.tr}}">
<div style="display: flex; align-items: center; height: 76px; padding: 0 8px; border-radius: 38px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1)">
<div style="display: flex; flex-direction: column; gap: 1px; padding: 0 22px"><span style="font-size: 15px; font-weight: 600">PC-Salon</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">En ligne</span></div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; flex-direction: column; gap: 1px; padding: 0 22px"><span style="font-size: 15px; font-weight: 600">4 ms</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">Wi-Fi excellent</span></div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; flex-direction: column; gap: 1px; padding: 0 22px"><span style="font-size: 15px; font-weight: 600">82 %</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">Environ 3 h</span></div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 22px 0 18px"><div aria-hidden="true" style="width: 32px; height: 45px; border-radius: 5px; background: {{art}}; box-shadow: 0 0 0 1px rgba(255,255,255,0.1)"></div><div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">Minecraft</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.55)">Il y a 2 h</span></div></div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: rgba(245,245,247,0.5); opacity: {{idle.op}}; transition: {{idle.tr}}">Appuyez sur <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.45); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #F5F5F7">A</span> pour ouvrir l'accueil</div>

<div style="position: absolute; z-index: 45; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #F5F5F7; color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">A</span>Réveil
</div>
<div aria-hidden="true" style="position: absolute; z-index: 50; inset: 0; background: #000; opacity: {{curtain}}; transition: opacity 400ms ease-in-out"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 8000 }), 100);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const instant = t >= 7350;
    const wake = t >= 2000 && !instant;
    const E = 'cubic-bezier(.32,.72,0,1)';
    const tr = (dur, delay, props) => instant ? 'none' : props.map((p) => p + ' ' + dur + 'ms ' + (p === 'opacity' || p === 'filter' ? 'ease' : E) + ' ' + delay + 'ms').join(', ');
    const ART = {
      mc: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      ce: 'radial-gradient(circle at 40% 30%, #F49AC1 0%, transparent 42%), radial-gradient(circle at 65% 75%, #6C4BD1 0%, transparent 52%), linear-gradient(160deg, #2B1B4F 0%, #0C0818 100%)',
      sv: 'radial-gradient(circle at 30% 30%, #F6D55C 0%, transparent 40%), radial-gradient(circle at 65% 70%, #6DBE45 0%, transparent 52%), linear-gradient(160deg, #2F6B3A 0%, #0E1E10 100%)',
      er: 'radial-gradient(circle at 50% 30%, #E8C46A 0%, transparent 38%), radial-gradient(circle at 40% 80%, #5C4520 0%, transparent 52%), linear-gradient(160deg, #2A2214 0%, #0A0805 100%)',
      ha: 'radial-gradient(circle at 45% 30%, #FF6B4A 0%, transparent 40%), radial-gradient(circle at 60% 78%, #8A1C1C 0%, transparent 52%), linear-gradient(160deg, #2A0B0B 0%, #090303 100%)'
    };
    const order = [['Hades', 'ha'], ['Celeste', 'ce'], ['Hollow Knight', 'hk'], ['Minecraft', 'mc'], ['Forza Horizon 5', 'fh'], ['Stardew Valley', 'sv'], ['Elden Ring', 'er']];
    const S = [[240, 340, 0, 1], [190, 269, 250, 0.6], [160, 227, 430, 0.38], [140, 198, 580, 0.2]];
    const covers = order.map((x, i) => {
      const o = i - 3;
      const k = Math.abs(o);
      const z = S[k];
      const sg = Math.sign(o);
      const cx = 640 + sg * z[2];
      const dx = wake ? 0 : Math.round(640 - cx);
      const rot = wake && o !== 0 ? -sg * (38 + (k - 1) * 6) : 0;
      const delay = o === 0 ? 250 : 380 + k * 70;
      return {
        title: x[0], art: ART[x[1]], w: z[0], h: z[1],
        left: Math.round(cx - z[0] / 2), top: 436 - z[1], z: 10 - k,
        transform: 'perspective(900px) translateX(' + dx + 'px) rotateY(' + rot + 'deg) scale(' + (wake ? 1 : 0.84) + ')',
        filter: 'brightness(' + z[3] + ')',
        opacity: wake ? 1 : 0,
        shadow: o === 0 ? '0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12)' : '0 20px 40px rgba(0,0,0,0.5)',
        tr: tr(o === 0 ? 900 : 800, delay, ['transform', 'opacity'])
      };
    });
    const rise = (delay) => ({ op: wake ? 1 : 0, ty: wake ? 0 : 18, blur: wake ? 0 : 8, tr: tr(650, delay, ['opacity', 'transform', 'filter']) });
    const raw = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    return {
      accent: this.props.accent ?? '#F2802A',
      art: ART.mc,
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      date: raw.charAt(0).toUpperCase() + raw.slice(1),
      covers: covers,
      homeOp: wake ? 1 : 0,
      glowOp: wake ? 0 : 0.22,
      bgTr: tr(1000, 100, ['opacity']),
      idle: { op: wake ? 0 : 1, ty: wake ? -12 : 0, blur: wake ? 8 : 0, tr: tr(380, 0, ['opacity', 'transform', 'filter']) },
      capScale: wake ? 0.95 : 1,
      clock: {
        transform: wake ? 'translate(520px, -218px) scale(0.0852)' : 'translate(0px, 0px) scale(1)',
        op: wake ? 0 : 1,
        tr: instant ? 'none' : 'transform 820ms ' + E + ', opacity 220ms ease ' + (wake ? 640 : 0) + 'ms'
      },
      small: { op: wake ? 1 : 0, tr: instant ? 'none' : 'opacity 260ms ease ' + (wake ? 620 : 0) + 'ms' },
      r1: rise(520),
      r2: rise(600),
      r3: { op: wake ? 1 : 0, tr: tr(500, 760, ['opacity']) },
      tb: { op: wake ? 1 : 0, ty: wake ? 0 : -10, tr: tr(600, 450, ['opacity', 'transform']) },
      keyOp: t >= 1700 && t < 2300 ? 1 : 0,
      keyTy: t >= 1700 && t < 2300 ? 0 : 8,
      curtain: t >= 7000 ? 1 : 0
    };
  }
}
</script>
</body>
</html>
