<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Extinction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{homeOp}}; transition: {{bgTr}}">
<div style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.85) 75%)"></div>
</div>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 560px">
<sc-for list="{{covers}}" as="c" hint-placeholder-count="6">
<div style="position: absolute; left: {{c.left}}px; top: {{c.top}}px; width: {{c.w}}px; height: {{c.h}}px; z-index: {{c.z}}; transform: {{c.transform}}; filter: {{c.filter}}; opacity: {{c.opacity}}; transition: {{c.tr}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{c.art}}; box-shadow: 0 20px 40px rgba(0,0,0,0.5)">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0) 45%)"></div>
<span style="position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600">{{c.title}}</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 520px; top: 442px; width: 240px; height: 340px; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{art}}; opacity: {{homeOp}}; transition: {{fastFade}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 516px; display: flex; flex-direction: column; align-items: center; opacity: {{homeOp}}; transform: translateY({{homeTy}}px); transition: {{fastFade}}">
<span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05">Minecraft</span>
<span style="margin-top: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62)">Mojang Studios · 2011 · Bac à sable</span>
<div style="margin-top: 26px; display: flex; gap: 12px">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 90px; opacity: {{homeOp}}; transition: {{fastFade}}">
<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; top: 30px; right: 56px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent)"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500">4 ms</span></div>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span>
</div>
</div>

<span style="position: absolute; right: 601.7px; top: 369.66px; height: 64px; font-size: 64px; font-weight: 600; letter-spacing: -1.28px; line-height: 64px; white-space: nowrap; opacity: {{word.op}}; transform: translateX({{word.txL}}px); filter: blur({{word.blur}}px); transition: {{word.tr}}">Coco</span>
<span style="position: absolute; left: 732.4px; top: 369.66px; height: 64px; font-size: 64px; font-weight: 600; letter-spacing: -1.28px; line-height: 64px; white-space: nowrap; color: var(--accent); opacity: {{word.op}}; transform: translateX({{word.txR}}px); filter: blur({{word.blur}}px); transition: {{word.tr}}">S</span>

<div role="img" aria-label="CocoOS" style="position: absolute; z-index: 20; left: {{hero.left}}px; top: {{hero.top}}px; width: {{hero.w}}px; height: {{hero.h}}px; box-sizing: border-box; border: {{hero.bw}}px solid {{hero.bc}}; border-radius: {{hero.r}}; background-color: {{hero.bg}}; overflow: hidden; opacity: {{hero.op}}; box-shadow: {{hero.shadow}}; transition: {{hero.tr}}">
<div style="position: absolute; inset: 0; background: {{art}}; opacity: {{hero.artOp}}; transition: {{hero.artTr}}">
<span style="position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: rgba(245,245,247,0.55); white-space: nowrap">Jaquette Minecraft</span>
</div>
</div>
<svg aria-hidden="true" width="49.3" height="49.3" viewBox="0 0 49.3 49.3" style="position: absolute; z-index: 21; left: 681.35px; top: 375.35px; opacity: {{arcOp}}; transition: opacity 150ms ease">
<circle cx="24.65" cy="24.65" r="20.25" fill="none" stroke-width="8.8" stroke-dasharray="127.23" transform="rotate(-90 24.65 24.65) scale(1 1)" style="stroke: var(--accent); stroke-dashoffset: {{arcOff}}; transition: {{arcTr}}"></circle>
</svg>

<div style="position: absolute; z-index: 45; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v7" stroke="#000" stroke-width="2.2" stroke-linecap="round"></path><path d="M6 5.2a6.5 6.5 0 1 0 8 0" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"></path></svg></span>Éteindre
</div>
<div aria-hidden="true" style="position: absolute; z-index: 50; inset: 0; background: #000; opacity: {{curtain}}; transition: opacity 400ms ease-in-out"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 9000 }), 100);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const accent = this.props.accent ?? '#F2802A';
    const track = 'color-mix(in oklab, ' + accent + ' 30%, transparent)';
    const instant = t >= 8600;
    const ph = instant || t < 1200 ? 'home' : t < 1900 ? 'collapse' : t < 2800 ? 'ring' : t < 3700 ? 'logo' : t < 5300 ? 'unwind' : t < 6100 ? 'dot' : 'off';
    const home = ph === 'home';
    const E = 'cubic-bezier(.32,.72,0,1)';
    const ART = {
      mc: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      ce: 'radial-gradient(circle at 40% 30%, #F49AC1 0%, transparent 42%), radial-gradient(circle at 65% 75%, #6C4BD1 0%, transparent 52%), linear-gradient(160deg, #2B1B4F 0%, #0C0818 100%)',
      sv: 'radial-gradient(circle at 30% 30%, #F6D55C 0%, transparent 40%), radial-gradient(circle at 65% 70%, #6DBE45 0%, transparent 52%), linear-gradient(160deg, #2F6B3A 0%, #0E1E10 100%)',
      er: 'radial-gradient(circle at 50% 30%, #E8C46A 0%, transparent 38%), radial-gradient(circle at 40% 80%, #5C4520 0%, transparent 52%), linear-gradient(160deg, #2A2214 0%, #0A0805 100%)',
      ha: 'radial-gradient(circle at 45% 30%, #FF6B4A 0%, transparent 40%), radial-gradient(circle at 60% 78%, #8A1C1C 0%, transparent 52%), linear-gradient(160deg, #2A0B0B 0%, #090303 100%)'
    };
    const order = [['Hades', 'ha'], ['Celeste', 'ce'], ['Hollow Knight', 'hk'], null, ['Forza Horizon 5', 'fh'], ['Stardew Valley', 'sv'], ['Elden Ring', 'er']];
    const S = [[240, 340, 0, 1], [190, 269, 250, 0.6], [160, 227, 430, 0.38], [140, 198, 580, 0.2]];
    const covers = [];
    order.forEach((x, i) => {
      if (!x) return;
      const o = i - 3;
      const k = Math.abs(o);
      const z = S[k];
      const sg = Math.sign(o);
      const cx = 640 + sg * z[2];
      const dx = home ? 0 : Math.round(640 - cx);
      covers.push({
        title: x[0], art: ART[x[1]], w: z[0], h: z[1],
        left: Math.round(cx - z[0] / 2), top: 436 - z[1], z: 10 - k,
        transform: 'perspective(900px) translateX(' + dx + 'px) rotateY(' + (home ? -sg * (38 + (k - 1) * 6) : 0) + 'deg) scale(' + (home ? 1 : 0.7) + ')',
        filter: 'brightness(' + z[3] + ')',
        opacity: home ? 1 : 0,
        tr: instant ? 'none' : 'transform 650ms ' + E + ' ' + (3 - k) * 40 + 'ms, opacity 450ms ease ' + (3 - k) * 40 + 'ms'
      });
    });
    const H = {
      home: { left: 520, top: 96, w: 240, h: 340, r: '12px', bw: 0, bc: accent, bg: 'transparent', op: 1, artOp: 1 },
      collapse: { left: 520, top: 96, w: 240, h: 340, r: '12px', bw: 0, bc: accent, bg: 'transparent', op: 1, artOp: 1 },
      ring: { left: 615.35, top: 241.35, w: 49.3, h: 49.3, r: '50%', bw: 8.8, bc: accent, bg: 'transparent', op: 1, artOp: 0 },
      logo: { left: 681.35, top: 375.35, w: 49.3, h: 49.3, r: '50%', bw: 8.8, bc: accent, bg: 'transparent', op: 1, artOp: 0 },
      unwind: { left: 681.35, top: 375.35, w: 49.3, h: 49.3, r: '50%', bw: 8.8, bc: track, bg: 'transparent', op: 1, artOp: 0 },
      dot: { left: 701, top: 395, w: 10, h: 10, r: '50%', bw: 0, bc: accent, bg: accent, op: 1, artOp: 0 },
      off: { left: 703, top: 397, w: 6, h: 6, r: '50%', bw: 0, bc: accent, bg: accent, op: 0, artOp: 0 }
    };
    const hero = Object.assign({}, H[ph]);
    hero.shadow = ph === 'dot' ? '0 0 24px 6px ' + track : (home || ph === 'collapse' ? '0 40px 90px rgba(0,0,0,0.6)' : '0 0 0 0 rgba(0,0,0,0)');
    hero.tr = instant ? 'none' : ['left', 'top', 'width', 'height', 'border-radius', 'border-width'].map((p) => p + ' ' + (ph === 'dot' ? 700 : 820) + 'ms ' + E).join(', ') + ', border-color 200ms ease, background-color 300ms ease, opacity 800ms ease, box-shadow 600ms ease';
    hero.artTr = instant ? 'none' : 'opacity 420ms ease';
    const wordOn = t >= 3000 && t < 5300 && !instant;
    return {
      accent: accent,
      art: ART.mc,
      time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      covers: covers,
      homeOp: home ? 1 : 0,
      homeTy: home ? 0 : 14,
      bgTr: instant ? 'none' : 'opacity 700ms ease',
      fastFade: instant ? 'none' : 'opacity 300ms ease, transform 400ms ' + E,
      hero: hero,
      word: {
        op: wordOn ? 1 : 0,
        txL: wordOn ? 0 : (t >= 5300 ? -18 : 0),
        txR: wordOn ? 0 : (t >= 5300 ? 18 : 0),
        blur: wordOn ? 0 : 8,
        tr: instant ? 'none' : 'opacity 600ms ease, transform 700ms ' + E + ', filter 600ms ease'
      },
      arcOp: t >= 3500 && t < 5300 && !instant ? 1 : 0,
      arcOff: t >= 3700 && !instant ? 127.23 : 0,
      arcTr: instant || t < 3700 ? 'none' : 'stroke-dashoffset 1400ms cubic-bezier(.65,0,.35,1)',
      keyOp: t >= 800 && t < 1400 ? 1 : 0,
      keyTy: t >= 800 && t < 1400 ? 0 : 8,
      curtain: t >= 8300 ? 1 : 0
    };
  }
}
</script>
</body>
</html>
