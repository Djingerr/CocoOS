<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Démarrage — vers le carrousel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoWordLeft{0%,4%{opacity:0;filter:blur(8px);transform:translateY(8px)}14%{opacity:1;filter:blur(0);transform:none}32%{opacity:1;filter:blur(0);transform:none}38%,100%{opacity:0;filter:blur(6px);transform:translateX(-18px)}}
@keyframes cocoWordRight{0%,4%{opacity:0;filter:blur(8px);transform:translateY(8px)}14%{opacity:1;filter:blur(0);transform:none}32%{opacity:1;filter:blur(0);transform:none}38%,100%{opacity:0;filter:blur(6px);transform:translateX(18px)}}
@keyframes cocoHero{
0%,4%{opacity:0;filter:blur(8px);left:681.35px;top:375.35px;width:49.3px;height:49.3px;border-radius:50%;border-width:8.8px;border-color:var(--track);box-shadow:0 0 0 rgba(0,0,0,0)}
14%{opacity:1;filter:blur(0);left:681.35px;top:375.35px;width:49.3px;height:49.3px;border-radius:50%;border-width:8.8px;border-color:var(--track)}
32%{opacity:1;filter:blur(0);left:681.35px;top:375.35px;width:49.3px;height:49.3px;border-radius:50%;border-width:8.8px;border-color:var(--track)}
33%{border-color:var(--accent)}
40%{opacity:1;filter:blur(0);left:615.35px;top:241.35px;width:49.3px;height:49.3px;border-radius:50%;border-width:8.8px;border-color:var(--accent);box-shadow:0 0 0 rgba(0,0,0,0)}
48%{opacity:1;filter:blur(0);left:520px;top:96px;width:240px;height:340px;border-radius:12px;border-width:0px;border-color:var(--accent);box-shadow:0 40px 90px rgba(0,0,0,0.6)}
100%{opacity:1;filter:blur(0);left:520px;top:96px;width:240px;height:340px;border-radius:12px;border-width:0px;border-color:var(--accent);box-shadow:0 40px 90px rgba(0,0,0,0.6)}
}
@keyframes cocoRingMove{0%,32%{transform:translate(0,0)}40%,100%{transform:translate(-66px,-134px)}}
@keyframes cocoArc{0%,14%{stroke-dashoffset:127.23}32%,100%{stroke-dashoffset:0}}
@keyframes cocoRingLayer{0%,38%{opacity:1}41%,100%{opacity:0}}
@keyframes cocoGlow{0%,10%{opacity:0;transform:scale(.6)}24%{opacity:.5;transform:scale(1)}32%{opacity:.7;transform:scale(1.1)}40%,100%{opacity:0;transform:scale(1.6)}}
@keyframes cocoArt{0%,40%{opacity:0}48%,100%{opacity:1}}
@keyframes cocoBackdrop{0%,44%{opacity:0}62%,100%{opacity:1}}
@keyframes cocoReflect{0%,46%{opacity:0}54%,100%{opacity:1}}
@keyframes cocoFan1{0%,46%{opacity:0;transform:perspective(900px) translateX(var(--dx)) rotateY(0deg) scale(.8)}58%,100%{opacity:1;transform:perspective(900px) translateX(0) rotateY(var(--rot)) scale(1)}}
@keyframes cocoFan2{0%,48%{opacity:0;transform:perspective(900px) translateX(var(--dx)) rotateY(0deg) scale(.8)}60%,100%{opacity:1;transform:perspective(900px) translateX(0) rotateY(var(--rot)) scale(1)}}
@keyframes cocoFan3{0%,50%{opacity:0;transform:perspective(900px) translateX(var(--dx)) rotateY(0deg) scale(.8)}62%,100%{opacity:1;transform:perspective(900px) translateX(0) rotateY(var(--rot)) scale(1)}}
@keyframes cocoRise1{0%,54%{opacity:0;transform:translateY(18px);filter:blur(8px)}64%,100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes cocoRise2{0%,56%{opacity:0;transform:translateY(18px);filter:blur(8px)}66%,100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes cocoRise3{0%,58%{opacity:0;transform:translateY(18px);filter:blur(8px)}68%,100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes cocoDrop{0%,60%{opacity:0;transform:translateY(-10px)}70%,100%{opacity:1;transform:none}}
@keyframes cocoHint{0%,64%{opacity:0}74%,100%{opacity:1}}
@keyframes cocoCurtain{0%,93%{opacity:0}98%,100%{opacity:1}}
@keyframes cocoSheenOnce{0%,66%{transform:translateX(-160%) skewX(-18deg)}80%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.32) translate(-24px,12px)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<div style="--accent: {{accent}}; --track: {{track}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">

<div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0; animation: cocoBackdrop {{T}}s ease-in-out infinite">
<div style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan {{T}}s ease-in-out infinite"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.85) 75%)"></div>
</div>
<svg aria-hidden="true" width="1280" height="800" style="position: absolute; left: 0; top: 0; opacity: 0.07; mix-blend-mode: overlay"><filter id="grainBoot"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1280" height="800" filter="url(#grainBoot)"></rect></svg>

<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{c.art}}; box-shadow: 0 20px 40px rgba(0,0,0,0.5)">
<div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 45%)"></div>
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0) 48%)"></div>
<span style="position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 12px; font-weight: 600; line-height: 1.15">{{c.title}}</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: {{c.reflTop}}px; width: {{c.w}}px; height: {{c.h}}px; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 520px; top: 442px; width: 240px; height: 340px; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{art}}; opacity: 0; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); animation: cocoReflect {{T}}s ease-in-out infinite"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 160px; height: 560px; background: linear-gradient(90deg, rgba(0,0,0,0.75), rgba(0,0,0,0))"></div>
<div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 160px; height: 560px; background: linear-gradient(270deg, rgba(0,0,0,0.75), rgba(0,0,0,0))"></div>

<div aria-hidden="true" style="position: absolute; left: 626px; top: 320px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0%, rgba(0,0,0,0) 65%); filter: blur(24px); opacity: 0; animation: cocoGlow {{T}}s ease-in-out infinite"></div>

<span style="position: absolute; right: 601.7px; top: 369.66px; height: 64px; font-size: 64px; font-weight: 600; letter-spacing: -1.28px; line-height: 64px; white-space: nowrap; opacity: 0; animation: cocoWordLeft {{T}}s cubic-bezier(.32,.72,0,1) infinite">Coco</span>
<span style="position: absolute; left: 732.4px; top: 369.66px; height: 64px; font-size: 64px; font-weight: 600; letter-spacing: -1.28px; line-height: 64px; white-space: nowrap; color: var(--accent); opacity: 0; animation: cocoWordRight {{T}}s cubic-bezier(.32,.72,0,1) infinite">S</span>

<div style="position: absolute; inset: 0; background: {{art}}; opacity: 0; animation: cocoArt {{T}}s ease-in-out infinite">
<div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 45%)"></div>
<div style="position: absolute; top: -20%; bottom: -20%; left: 0; width: 30%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.18), rgba(255,255,255,0)); animation: cocoSheenOnce {{T}}s ease-in-out infinite"></div>
<span style="position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: rgba(245,245,247,0.55); white-space: nowrap">Jaquette Minecraft</span>

<svg aria-hidden="true" width="49.3" height="49.3" viewBox="0 0 49.3 49.3" style="position: absolute; z-index: 21; left: 681.35px; top: 375.35px; overflow: visible; animation: cocoRingLayer {{T}}s linear infinite, cocoRingMove {{T}}s cubic-bezier(.32,.72,0,1) infinite">
<circle cx="24.65" cy="24.65" r="20.25" fill="none" stroke-width="8.8" stroke-dasharray="127.23" stroke-dashoffset="127.23" transform="rotate(-90 24.65 24.65)" style="stroke: var(--accent); animation: cocoArc {{T}}s cubic-bezier(.65,0,.35,1) infinite"></circle>

<div style="position: absolute; left: 0; right: 0; top: 516px; display: flex; flex-direction: column; align-items: center">
<h1 style="margin: 0; font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05; opacity: 0; animation: cocoRise1 {{T}}s cubic-bezier(.32,.72,0,1) infinite">Minecraft</h1>
<div style="margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62); opacity: 0; animation: cocoRise2 {{T}}s cubic-bezier(.32,.72,0,1) infinite">
<span>Mojang Studios</span><span>·</span><span>2011</span><span>·</span><span>Bac à sable</span>
<span style="height: 20px; padding: 0 7px; box-sizing: border-box; border: 1px solid rgba(245,245,247,0.35); border-radius: 5px; font-size: 11px; font-weight: 600; display: flex; align-items: center">PEGI 7</span>
</div>
<div style="margin-top: 26px; display: flex; gap: 12px; opacity: 0; animation: cocoRise3 {{T}}s cubic-bezier(.32,.72,0,1) infinite">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>
</div>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 90px; opacity: 0; animation: cocoDrop {{T}}s cubic-bezier(.32,.72,0,1) infinite">
<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; left: 0; right: 0; top: 28px; display: flex; justify-content: center">
<div style="display: flex; align-items: center; gap: 10px">
<span style="height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; border: 1px solid rgba(245,245,247,0.3); font-size: 10px; font-weight: 600; color: rgba(245,245,247,0.6); display: flex; align-items: center">LB</span>
<nav aria-label="Catégories" style="display: flex; padding: 4px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1)">
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 14px; font-weight: 600">Tout</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Favoris</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Récents</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Apps</button>
</nav>
<span style="height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; border: 1px solid rgba(245,245,247,0.3); font-size: 10px; font-weight: 600; color: rgba(245,245,247,0.6); display: flex; align-items: center">RB</span>
</div>
</div>
<div style="position: absolute; top: 30px; right: 56px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600">
<span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500; font-variant-numeric: tabular-nums">4 ms</span>
</div>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span>
<svg width="25" height="12" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#F5F5F7" stroke-opacity="0.45"></rect><rect x="2" y="2" width="16.4" height="9" rx="2" fill="#F5F5F7"></rect><rect x="24.8" y="4.5" width="1.6" height="4" rx="0.8" fill="#F5F5F7" fill-opacity="0.45"></rect></svg>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; align-items: center; gap: 28px; font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.55); opacity: 0; animation: cocoHint {{T}}s ease-out infinite">
<span style="display: flex; align-items: center; gap: 8px">
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.45); display: flex; align-items: center; justify-content: center"><svg width="11" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M5 1 1 5l4 4M1 5h10" stroke="#F5F5F7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.45); display: flex; align-items: center; justify-content: center"><svg width="11" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M7 1l4 4-4 4M11 5H1" stroke="#F5F5F7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
Parcourir</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.45); display: flex; align-items: center; justify-content: center"><svg width="9" height="11" viewBox="0 0 10 12" aria-hidden="true"><path d="M5 1v9M1.5 6.8 5 10.3l3.5-3.5" stroke="#F5F5F7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Plus d'infos</span>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 50; background: #000; opacity: 0; pointer-events: none; animation: cocoCurtain {{T}}s ease-in-out infinite"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"cycle":{"editor":"range","default":10,"min":6,"max":20,"step":0.5,"unit":"s"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._timer = setInterval(() => this.setState({ now: Date.now() }), 15000);
  }
  componentWillUnmount() {
    clearInterval(this._timer);
  }
  renderVals() {
    const d = new Date((this.state && this.state.now) || Date.now());
    const pad = (n) => String(n).padStart(2, '0');
    const accent = this.props.accent ?? '#F2802A';
    const ART = {
      mc: 'radial-gradient(circle at 30% 25%, #5E8F4E 0%, transparent 45%), radial-gradient(circle at 70% 78%, #6B4A2F 0%, transparent 50%), radial-gradient(circle at 82% 18%, #7FA6C8 0%, transparent 38%), linear-gradient(160deg, #1E2A1C 0%, #14110D 100%)',
      hk: 'radial-gradient(circle at 35% 30%, #7FA3C9 0%, transparent 42%), radial-gradient(circle at 70% 75%, #22365C 0%, transparent 55%), linear-gradient(160deg, #1A2540 0%, #06080E 100%)',
      fh: 'radial-gradient(circle at 70% 25%, #FFB347 0%, transparent 40%), radial-gradient(circle at 30% 70%, #D8345F 0%, transparent 50%), linear-gradient(160deg, #4A1747 0%, #12081A 100%)',
      ce: 'radial-gradient(circle at 40% 30%, #F49AC1 0%, transparent 42%), radial-gradient(circle at 65% 75%, #6C4BD1 0%, transparent 52%), linear-gradient(160deg, #2B1B4F 0%, #0C0818 100%)',
      sv: 'radial-gradient(circle at 30% 30%, #F6D55C 0%, transparent 40%), radial-gradient(circle at 65% 70%, #6DBE45 0%, transparent 52%), linear-gradient(160deg, #2F6B3A 0%, #0E1E10 100%)',
      er: 'radial-gradient(circle at 50% 30%, #E8C46A 0%, transparent 38%), radial-gradient(circle at 40% 80%, #5C4520 0%, transparent 52%), linear-gradient(160deg, #2A2214 0%, #0A0805 100%)',
      ha: 'radial-gradient(circle at 45% 30%, #FF6B4A 0%, transparent 40%), radial-gradient(circle at 60% 78%, #8A1C1C 0%, transparent 52%), linear-gradient(160deg, #2A0B0B 0%, #090303 100%)'
    };
    const order = [['Hades', 'ha'], ['Celeste', 'ce'], ['Hollow Knight', 'hk'], null, ['Forza Horizon 5', 'fh'], ['Stardew Valley', 'sv'], ['Elden Ring', 'er']];
    const sizes = [[240, 340, 0, 1], [190, 269, 250, 0.6], [160, 227, 430, 0.38], [140, 198, 580, 0.2]];
    const floor = 436;
    const covers = [];
    order.forEach((x, i) => {
      if (!x) return;
      const o = i - 3;
      const k = Math.abs(o);
      const s = sizes[k];
      const cx = 640 + Math.sign(o) * s[2];
      covers.push({
        title: x[0],
        art: ART[x[1]],
        w: s[0],
        h: s[1],
        left: Math.round(cx - s[0] / 2),
        top: floor - s[1],
        reflTop: s[1] + 6,
        z: 10 - k,
        dx: Math.round(640 - cx),
        rot: -Math.sign(o) * (38 + (k - 1) * 6),
        filter: 'brightness(' + s[3] + ')',
        anim: 'cocoFan' + k
      });
    });
    return {
      accent: accent,
      track: 'color-mix(in oklab, ' + accent + ' 30%, transparent)',
      T: this.props.cycle ?? 10,
      art: ART.mc,
      covers: covers,
      time: pad(d.getHours()) + ':' + pad(d.getMinutes())
    };
  }
}
</script>
</body>
