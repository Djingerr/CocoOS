<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Motion — Volume (style iOS)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@100..700&display=swap">
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes cocoCloud{0%{transform:translateX(0)}100%{transform:translateX(-300px)}}
@keyframes cocoWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cocoPan{0%{transform:translateX(0)}100%{transform:translateX(-120px)}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -60px">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, #7FB6DE 0%, #BFDDF0 46%, #6E9F55 47%, #4C7A39 70%, #3A2B1D 100%)"></div>
<div style="position: absolute; left: 1040px; top: 120px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #FFF6D6 0%, rgba(255,246,214,0) 70%)"></div>
<div style="position: absolute; left: 0; top: 140px; width: 1800px; height: 120px; animation: cocoCloud 16s linear infinite alternate">
<div style="position: absolute; left: 240px; top: 10px; width: 180px; height: 40px; background: rgba(255,255,255,0.85)"></div>
<div style="position: absolute; left: 700px; top: 50px; width: 240px; height: 44px; background: rgba(255,255,255,0.8)"></div>
<div style="position: absolute; left: 1180px; top: 0; width: 160px; height: 36px; background: rgba(255,255,255,0.85)"></div>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 1600px; height: 60%; animation: cocoPan 12s ease-in-out infinite alternate">
<div style="position: absolute; inset: 0; background: #3F6B2F; clip-path: polygon(0 40%, 12% 30%, 24% 42%, 38% 22%, 52% 38%, 66% 26%, 80% 40%, 100% 30%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56%; background: #5A4128; clip-path: polygon(0 30%, 20% 24%, 40% 34%, 60% 20%, 80% 32%, 100% 22%, 100% 100%, 0 100%)"></div>
</div>
<div style="position: absolute; left: 650px; top: 470px; width: 36px; height: 72px; background: #2E4E7A; animation: cocoWalk .6s ease-in-out infinite"><div style="position: absolute; left: 4px; top: -28px; width: 28px; height: 28px; background: #C9A27A"></div></div>
<span style="position: absolute; left: 0; right: 0; top: 420px; text-align: center; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7)">[Flux vidéo du jeu]</span>
</div>

<div role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{level}}" style="position: absolute; left: {{hudLeft}}px; top: 14px; width: 220px; height: {{hud.h}}px; transform-origin: {{hud.origin}}; transform: translateY({{hud.ty}}px) scaleX({{hud.sx}}); opacity: {{hud.op}}; transition: {{hud.tr}}">
<div style="position: absolute; inset: 0; border-radius: 999px; overflow: hidden; background: rgba(40,40,42,0.62); box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.12); backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8)">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{level}}%; background: #F5F5F7; transition: width 260ms cubic-bezier(.32,.72,0,1)"></div>
<div style="position: absolute; left: 14px; top: 0; bottom: 0; display: flex; align-items: center; opacity: {{hud.iconOp}}; transform: scale({{hud.iconSc}}); transition: opacity 180ms ease, transform 300ms cubic-bezier(.3,1.3,.4,1)">
<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4-3.2v11.4l-4-3.2H3z" style="fill: {{iconColor}}; transition: fill 200ms ease"></path><path d="M13 7.5a3.5 3.5 0 0 1 0 5" stroke-width="1.7" fill="none" stroke-linecap="round" style="stroke: {{iconColor}}; opacity: {{w1}}; transition: opacity 200ms ease"></path><path d="M15.5 5a7 7 0 0 1 0 10" stroke-width="1.7" fill="none" stroke-linecap="round" style="stroke: {{iconColor}}; opacity: {{w2}}; transition: opacity 200ms ease"></path><path d="M13 7l5 6M18 7l-5 6" stroke-width="1.7" stroke-linecap="round" style="stroke: {{iconColor}}; opacity: {{mute}}; transition: opacity 200ms ease"></path></svg>
</div>
</div>
</div>

<div style="position: absolute; z-index: 45; right: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(30,30,32,0.6); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="min-width: 26px; height: 26px; border-radius: 13px; background: #F5F5F7; color: #000; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; transform: scale({{keySc}}); transition: transform 110ms ease">{{keyGlyph}}</span>{{keyLabel}}
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2802A","options":["#F2802A","#F5F5F7","#6E9BFF"]},"position":{"editor":"enum","default":"gauche","options":["gauche","centre","droite"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._tick = setInterval(() => this.setState({ t: (Date.now() - this._start) % 9000 }), 30);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const pos = this.props.position ?? 'gauche';
    const hudLeft = pos === 'gauche' ? 120 : (pos === 'droite' ? 940 : 530);
    const up = [900, 1130, 1360, 1590, 1820, 2120, 2400];
    const down = [5200, 5420, 5640, 5860, 6080, 6400, 6680];
    const upCount = up.filter((p) => t >= p).length;
    const downCount = down.filter((p) => t >= p).length;
    let level = 50;
    if (t >= 900 && t < 5200) level = Math.min(100, 50 + 10 * upCount);
    else if (t >= 5200) level = Math.max(0, 100 - 20 * downCount);
    if (t < 900) level = 50;
    const visible = (t >= 900 && t < 4400) || (t >= 5200 && t < 8300);
    const expanded = (t >= 1020 && t < 3800) || (t >= 5320 && t < 7700);
    const overUp = up.slice(5).some((p) => t >= p && t < p + 180);
    const overDown = down.slice(5).some((p) => t >= p && t < p + 180);
    const press = up.concat(down).some((p) => t >= p && t < p + 120);
    const stretch = overUp || overDown;
    const h = expanded ? (stretch ? 42 : 48) : 10;
    const hud = {
      h: h,
      ty: visible ? 0 : -40,
      sx: stretch ? 1.07 : 1,
      origin: overDown ? '100% 50%' : '0% 50%',
      op: visible ? 1 : 0,
      iconOp: expanded ? 1 : 0,
      iconSc: expanded ? 1 : 0.6,
      tr: [
        'height ' + (expanded ? '420ms cubic-bezier(.3,1.3,.4,1)' : '300ms cubic-bezier(.32,.72,0,1)'),
        'transform ' + (stretch ? '140ms ease-out' : '520ms cubic-bezier(.3,1.5,.4,1)'),
        'opacity ' + (visible ? '160ms ease' : '260ms ease-in 120ms')
      ].join(', ')
    };
    const muted = level === 0;
    const iconOnFill = level >= 20;
    const keyUp = t >= 800 && t < 2600;
    const keyDown = t >= 5100 && t < 6900;
    return {
      accent: this.props.accent ?? '#F2802A',
      hudLeft: hudLeft,
      level: level,
      hud: hud,
      iconColor: iconOnFill ? '#1C1C1E' : '#F5F5F7',
      w1: muted ? 0 : 1,
      w2: !muted && level >= 50 ? 1 : 0,
      mute: muted ? 1 : 0,
      keyOp: keyUp || keyDown ? 1 : 0,
      keyTy: keyUp || keyDown ? 0 : 8,
      keyGlyph: keyDown ? '−' : '+',
      keyLabel: keyDown ? 'Volume' : 'Volume',
      keySc: press ? 0.86 : 1
    };
  }
}
</script>
</body>
</html>
