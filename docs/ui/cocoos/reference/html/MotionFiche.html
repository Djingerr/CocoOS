<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Motion — Accueil vers fiche</title>
<style>

  src:url(fonts/sora-latin-wght-normal.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Sora';font-style:normal;font-weight:100 800;font-display:block;
  src:url(fonts/sora-latin-ext-wght-normal.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

html,body{margin:0;background:#000}
#root{width:1280px;height:800px;overflow:hidden;position:relative}
</style>
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoBgPan{0%{transform:scale(1.25) translate(0,0)}100%{transform:scale(1.34) translate(-30px,16px)}}
@keyframes cocoSheen{0%,55%{transform:translateX(-160%) skewX(-18deg)}85%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -100px; background: {{art}}; filter: blur(100px) saturate(1.1); animation: cocoBgPan 60s ease-in-out infinite alternate"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.85) 76%)"></div>
<svg aria-hidden="true" width="1280" height="800" style="position: absolute; left: 0; top: 0; opacity: 0.07; mix-blend-mode: overlay"><filter id="grainMF"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1280" height="800" filter="url(#grainMF)"></rect></svg>

<div style="position: absolute; left: 72px; top: 34px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; opacity: {{homeOp}}; transition: {{homeTr}}">Coco<span style="color: var(--accent)">OS</span></div>
<div style="position: absolute; left: 72px; top: 28px; display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 16px 0 10px; border-radius: 18px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12); font-size: 13px; font-weight: 600; opacity: {{ficheOp}}; transform: translateX({{backTx}}px); transition: {{ficheTr0}}"><svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5" stroke="#F5F5F7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Bibliothèque</div>
<div style="position: absolute; left: 0; right: 0; top: 28px; display: flex; justify-content: center; opacity: {{homeOp}}; transform: translateY({{tabsTy}}px); transition: {{homeTr}}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; border: 1px solid rgba(245,245,247,0.3); font-size: 10px; font-weight: 600; color: rgba(245,245,247,0.6); display: flex; align-items: center">LB</span>
<nav aria-label="Catégories" style="display: flex; padding: 4px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1)">
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 14px; font-weight: 600">Tout</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Favoris</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Récents</button>
<button style="padding: 7px 18px; border: none; border-radius: 16px; background: transparent; color: rgba(245,245,247,0.72); font-family: inherit; font-size: 14px; font-weight: 500">Apps</button>
</nav>
<span style="height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; border: 1px solid rgba(245,245,247,0.3); font-size: 10px; font-weight: 600; color: rgba(245,245,247,0.6); display: flex; align-items: center">RB</span>
</div>
</div>
<div style="position: absolute; top: 30px; right: 56px; display: flex; align-items: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.55); font-weight: 500">4 ms</span></div>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span>
<svg width="25" height="12" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#F5F5F7" stroke-opacity="0.45"></rect><rect x="2" y="2" width="16.4" height="9" rx="2" fill="#F5F5F7"></rect><rect x="24.8" y="4.5" width="1.6" height="4" rx="0.8" fill="#F5F5F7" fill-opacity="0.45"></rect></svg>
</div>

<div style="position: absolute; left: 0; top: 0; width: 1280px; height: 560px">
<sc-for list="{{covers}}" as="c" hint-placeholder-count="6">
<div style="position: absolute; left: {{c.left}}px; top: {{c.top}}px; width: {{c.w}}px; height: {{c.h}}px; z-index: {{c.z}}; transform: {{c.transform}}; filter: {{c.filter}}; opacity: {{c.opacity}}; transition: {{c.tr}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{c.art}}; box-shadow: 0 20px 40px rgba(0,0,0,0.5)">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0) 45%)"></div>
<span style="position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600">{{c.title}}</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{c.art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</sc-for>
<div style="position: absolute; z-index: 12; left: {{hero.left}}px; top: {{hero.top}}px; width: {{hero.w}}px; height: {{hero.h}}px; transform: perspective(1200px) rotateY({{hero.rot}}deg); transition: {{hero.tr}}">
<div style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: {{art}}; box-shadow: 0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12)">
<div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 45%)"></div>
<div style="position: absolute; top: -20%; bottom: -20%; left: 0; width: 30%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.16), rgba(255,255,255,0)); animation: cocoSheen 9s ease-in-out infinite"></div>
<span style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: rgba(245,245,247,0.55)">Jaquette Minecraft</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: calc(100% + 6px); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; transform: scaleY(-1); background: {{art}}; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%); mask-image: linear-gradient(to top, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0) 18%)"></div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 160px; height: 560px; background: linear-gradient(90deg, rgba(0,0,0,0.75), rgba(0,0,0,0))"></div>
<div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 160px; height: 560px; background: linear-gradient(270deg, rgba(0,0,0,0.75), rgba(0,0,0,0))"></div>

<div style="position: absolute; z-index: 13; left: 0; right: 0; top: 516px; display: flex; justify-content: center; transform-origin: 50% 0; transform: translateY({{titleTy}}px) scale({{titleScale}}); transition: {{heroTr}}">
<span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05">Minecraft</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: 576px; display: flex; justify-content: center; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.62); opacity: {{homeOp}}; transform: translateY({{homeOutTy}}px); filter: blur({{homeBlur}}px); transition: {{homeTr}}">Mojang Studios · 2011 · Bac à sable</div>
<div style="position: absolute; left: 0; right: 0; top: 620px; display: flex; justify-content: center; gap: 12px; opacity: {{homeOp}}; transform: translateY({{homeOutTy2}}px); filter: blur({{homeBlur}}px); transition: {{homeTr2}}">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</button>
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(245,245,247,0.5); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Y</span>Options</button>
</div>

<div style="position: absolute; left: 0; right: 0; top: 478px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; color: rgba(245,245,247,0.64); opacity: {{ficheOp}}; transform: translateY({{ficheTy}}px); filter: blur({{ficheBlur}}px); transition: {{ficheTr1}}">
<span>Mojang Studios · 18 novembre 2011 · Bac à sable</span>
<span style="height: 20px; padding: 0 7px; box-sizing: border-box; border: 1px solid rgba(245,245,247,0.35); border-radius: 5px; font-size: 11px; font-weight: 600; display: flex; align-items: center">PEGI 7</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: 520px; display: flex; justify-content: center; opacity: {{ficheOp}}; transform: translateY({{ficheTy}}px); filter: blur({{ficheBlur}}px); transition: {{ficheTr2}}">
<div style="display: flex; align-items: center; height: 72px; padding: 0 8px; border-radius: 36px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11)">
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 0 24px"><span style="font-size: 16px; font-weight: 600">412 h</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.58)">Temps de jeu</span></div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 0 24px"><span style="font-size: 16px; font-weight: 600">Il y a 2 h</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.58)">Dernière session</span></div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 0 24px"><span style="font-size: 16px; font-weight: 600">93/100</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.58)">Note critique</span></div>
<div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1)"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 0 24px"><span style="font-size: 16px; font-weight: 600">1,2 Go</span><span style="font-size: 12px; font-weight: 500; color: rgba(245,245,247,0.58)">Taille installée</span></div>
</div>
</div>
<p style="position: absolute; left: 320px; top: 614px; width: 640px; margin: 0; text-align: center; font-size: 15px; font-weight: 400; line-height: 1.6; color: rgba(245,245,247,0.72); opacity: {{ficheOp}}; transform: translateY({{ficheTy}}px); filter: blur({{ficheBlur}}px); transition: {{ficheTr3}}">Explorez des mondes générés à l'infini, récoltez des ressources et construisez tout ce que vous imaginez, seul ou entre amis.</p>
<div style="position: absolute; left: 0; right: 0; top: 694px; display: flex; justify-content: center; gap: 12px; opacity: {{ficheOp}}; transform: translateY({{ficheTy}}px); filter: blur({{ficheBlur}}px); transition: {{ficheTr4}}">
<button style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 11px; border: none; border-radius: 26px; background: #F5F5F7; color: #000; font-family: inherit; font-size: 17px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 50%; background: #000; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">A</span>Jouer</button>
<button aria-label="Favori" style="width: 52px; height: 52px; border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16.5s-6-3.7-6-8.2A3.3 3.3 0 0 1 10 6a3.3 3.3 0 0 1 6 2.3c0 4.5-6 8.2-6 8.2z" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linejoin="round"></path></svg></button>
<button aria-label="Options" style="width: 52px; height: 52px; border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6" fill="#F5F5F7"></circle><circle cx="10" cy="10" r="1.6" fill="#F5F5F7"></circle><circle cx="15.5" cy="10" r="1.6" fill="#F5F5F7"></circle></svg></button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; align-items: center; gap: 28px; font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.55); opacity: {{homeOp}}; transition: {{homeTr}}">
<span>◀ ▶ Parcourir</span><span>↓ Plus d'infos</span>
</div>

<div style="position: absolute; z-index: 45; left: 32px; bottom: 32px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 8px; border-radius: 20px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 13px; font-weight: 600; opacity: {{keyOp}}; transform: translateY({{keyTy}}px); transition: opacity 200ms ease, transform 300ms cubic-bezier(.32,.72,0,1)">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true" style="transform: {{keyRot}}"><path d="M5 1v9M1.5 6.8 5 10.3l3.5-3.5" stroke="#000" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>{{keyLabel}}
</div>
</div>
</template>
