<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Motion — Menu en jeu</title>
<style>

  src:url(fonts/sora-latin-wght-normal.woff2) format('woff2');

@font-face{font-family:'Sora';font-style:normal;font-weight:100 800;font-display:block;

</style>
<style>
body{margin:0;background:#000}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
button{cursor:default}
@keyframes cocoCloud{0%{transform:translateX(0)}100%{transform:translateX(-300px)}}
@keyframes cocoWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cocoPan{0%{transform:translateX(0)}100%{transform:translateX(-120px)}}
@keyframes cocoLive{0%,100%{opacity:.35}50%{opacity:1}}
</style>

<body>
<div id="root"></div>
<template id="tpl">
<div style="--accent: {{accent}}; width: 1280px; height: 800px; background: #000; position: relative; overflow: hidden; font-family: 'Sora', sans-serif; color: #F5F5F7">
<div aria-hidden="true" style="position: absolute; inset: -60px; filter: {{frameFilter}}; transition: filter 480ms cubic-bezier(.32,.72,0,1)">

<div style="position: absolute; left: 0; top: 140px; width: 1800px; height: 120px; animation: cocoCloud 16s linear infinite alternate; animation-play-state: {{play}}">
<div style="position: absolute; left: 240px; top: 10px; width: 180px; height: 40px; background: rgba(255,255,255,0.85)"></div>
<div style="position: absolute; left: 700px; top: 50px; width: 240px; height: 44px; background: rgba(255,255,255,0.8)"></div>
<div style="position: absolute; left: 1180px; top: 0; width: 160px; height: 36px; background: rgba(255,255,255,0.85)"></div>
</div>

<div style="position: absolute; inset: 0; background: #3F6B2F; clip-path: polygon(0 40%, 12% 30%, 24% 42%, 38% 22%, 52% 38%, 66% 26%, 80% 40%, 100% 30%, 100% 100%, 0 100%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56%; background: #5A4128; clip-path: polygon(0 30%, 20% 24%, 40% 34%, 60% 20%, 80% 32%, 100% 22%, 100% 100%, 0 100%)"></div>
</div>
<div style="position: absolute; left: 650px; top: 470px; width: 36px; height: 72px; background: #2E4E7A; animation: cocoWalk .6s ease-in-out infinite; animation-play-state: {{play}}"><div style="position: absolute; left: 4px; top: -28px; width: 28px; height: 28px; background: #C9A27A"></div></div>

</div>

<div style="position: absolute; left: 264px; right: 264px; top: 72px; display: flex; justify-content: space-between; align-items: center; opacity: {{h.op}}; transform: translateY({{h.ty}}px); transition: {{h.tr}}">
<div style="display: flex; align-items: center; gap: 14px">
<div aria-hidden="true" style="width: 40px; height: 56px; border-radius: 6px; background: {{art}}; box-shadow: 0 0 0 1px rgba(255,255,255,0.12)"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Minecraft</span><span style="font-size: 13px; font-weight: 500; color: rgba(245,245,247,0.65)">En pause · 1 h 24 min</span></div>
</div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 13px; font-weight: 600">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: cocoLive 2.4s ease-in-out infinite"></span>PC-Salon<span style="color: rgba(245,245,247,0.6); font-weight: 500">4 ms</span></span>

</div>

</div>

</div>
<div style="grid-column: 7 / span 2; grid-row: 1 / span 4; position: relative; border-radius: 28px; overflow: hidden; background: rgba(255,255,255,0.1); border: 1px solid {{t3.border}}; opacity: {{t3.op}}; transform: scale({{t3.sc}}); box-shadow: {{t3.ring}}; transition: {{t3.tr}}">

</div>
<div style="grid-column: 1 / span 2; grid-row: 3 / span 2; box-sizing: border-box; padding: 20px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: space-between; opacity: {{t4.op}}; transform: scale({{t4.sc}}); transition: {{t4.tr}}">

<span style="font-size: 15px; font-weight: 600">Capture</span>
</div>

<span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V10M10 16V4M16 16v-7" stroke="#F5F5F7" stroke-width="2.2" stroke-linecap="round"></path></svg></span>
<span style="font-size: 15px; font-weight: 600">Statistiques</span>
</div>
<div style="grid-column: 1 / span 2; grid-row: 5; box-sizing: border-box; padding: 0 16px; border-radius: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; opacity: {{t6.op}}; transform: scale({{t6.sc}}); transition: {{t6.tr}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linejoin="round"></path></svg>Accueil</div>

</div>

</div>
