    push(x, 3, KW, { label: '@', kind: 'char', id: '@' }); x += KW + G;

    // ---- script
    const moves = [[0, 'g'], [1150, 's'], [1850, 'o'], [2550, 'i'], [3150, 'r'], [3800, 'e']];
    const presses = [1450, 2150, 2800, 3400, 5650, 6050];

    const accents = ['e', 'é', 'è', 'ê', 'ë', '€'].map((c, i) => ({
      c: c, bg: i === popIdx ? '#F5F5F7' : 'rgba(255,255,255,0.1)', fg: i === popIdx ? '#000' : '#F5F5F7', sc: i === popIdx ? 1.06 : 1
    }));

    const K = [
      [400, 1000, 'A', 'Saisir le mot de passe'], [1050, 1400, 'L', 'Déplacer'], [1400, 1650, 'A', 'Taper'],
      [1750, 2100, 'L', 'Déplacer'], [2100, 2350, 'A', 'Taper'], [2450, 2750, 'L', 'Déplacer'], [2750, 3000, 'A', 'Taper'],
      [3050, 3350, 'L', 'Déplacer'], [3350, 3600, 'A', 'Taper'], [3700, 3990, 'L', 'Déplacer'],
      [3990, 4840, 'A', 'Maintenir · accents'], [4840, 5100, 'L', 'é'], [5100, 5400, 'A', 'Relâcher'],
      [5600, 5900, 'A', 'Taper'], [6000, 6300, 'A', 'Taper'], [6450, 6800, 'X', 'Effacer'], [7000, 7500, '≡', 'Valider']
    ];
    const k = K.find((q) => t >= q[0] && t < q[1]);
    return {
      accent: accent,
      keys: outKeys,
      hl: hl,
      chars: chars,
      caretOp: checking || ok ? 0 : 1,
      accents: accents,
      pop: popOpen
        ? { op: 1, sc: 1, ty: 0, tr: 'opacity 160ms ease, transform 420ms cubic-bezier(.3,1.3,.4,1)' }
        : { op: 0, sc: 0.4, ty: 30, tr: 'opacity 160ms ease, transform 220ms cubic-bezier(.4,0,1,1)' },
      kb: kbOn
        ? { op: 1, ty: 0, tr: 'opacity 240ms ease, transform 640ms cubic-bezier(.3,1.15,.4,1)' }
        : { op: 0, ty: 460, tr: instant ? 'none' : 'opacity 300ms ease 80ms, transform 380ms cubic-bezier(.4,0,1,1)' },
      field: {
        top: ok ? 200 : 160,
        line: ok ? 'rgba(255,255,255,0.16)' : (checking ? 'rgba(255,255,255,0.3)' : accent),
        ring: checking || ok ? '0 0 0 0 transparent' : '0 0 0 5px color-mix(in oklab, ' + accent + ' 22%, transparent)',
        spin: checking ? 1 : 0,
        ok: ok ? 1 : 0, okSc: ok ? 1 : 0.3
      },
      done: ok && t >= 8100 ? { op: 1, ty: 0, blur: 0 } : { op: 0, ty: 18, blur: 6 },
      keyOp: k ? 1 : 0,
      keyTy: k ? 0 : -8,
      keyGlyph: k ? k[2] : '',
      keyLabel: k ? k[3] : '',
      keySc: k && k[2] !== 'L' && t - k[0] < 140 ? 0.86 : 1,
      curtain: t >= 10100 ? 1 : 0
    };
  }
}
