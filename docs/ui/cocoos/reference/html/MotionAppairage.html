<div style="position: absolute; left: 0; right: 0; top: 180px; height: 90px">

<span style="font-size: 32px; font-weight: 600; letter-spacing: -0.03em">PC-Salon est associé</span>

</sc-for>
</div>

<div style="position: absolute; left: 592px; top: 306px; width: 96px; height: 96px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 60px {{glow}}; opacity: {{check.op}}; transform: scale({{check.sc}}); transition: {{check.tr}}">
